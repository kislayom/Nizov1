# LongMemEval bench config for the Blackwell server via SSH tunnel.
# - Ollama on server at localhost:11434 → tunnelled to our localhost:11435
# - Answerer/judge: qwen3.6:35b-a3b-q8_0 (MoE 35B total / 3B active)
# - Embedder: nomic-embed-text (already on server)
# - Extraction OFF — raw remember beats extraction on smaller LLMs in our
#   prior data; with 35B reasoning model we want to test pure recall first,
#   then re-test with extraction on for comparison.
# - Reflection / compaction OFF — separate concerns, not needed for the
#   fact-recall benchmark.

storage:
  backend: sqlite
  path: /tmp/nizo-longmemeval-server.db

vector:
  backend: inmemory

embedder:
  enabled: true
  backend: ollama
  ollama:
    base_url: http://localhost:11435     # tunnel to server's Ollama
    model: nomic-embed-text
    timeout_seconds: 60

extraction:
  enabled: false
  backend: none
  ollama:
    base_url: http://localhost:11435
    model: qwen3.6:35b-a3b-q8_0
    timeout_seconds: 180

consolidation:
  enabled: false
  consolidate_every_n: 999999
  backend: none

compaction:
  enabled: false
  backend: none

verifier:
  enabled: false

graph:
  enabled: true

recall:
  default_token_budget: 1500
  confidence_floor: 0.0
  min_similarity_floor: 0.55
  min_top_score: 0.55

server:
  port: 8767
  threads: 4

reflection:
  enabled: false
  tick_interval_minutes: 999999
  backend: none
