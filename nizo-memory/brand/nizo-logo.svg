<?xml version="1.0" encoding="UTF-8"?>
<!--
  nizo.ai brand sheet — three variants on one canvas.

  Concept: the mark is a 3-node knowledge graph that also reads as the
  letter "n". Two anchor nodes at the bottom, one apex node at the top,
  joined by two edges (the legs of the "n") and a single accent edge
  across the top — the kind of triangle you find at the heart of every
  recall query.

  Palette:
    ink     #0B1220   (wordmark, primary stroke)
    accent  #22D3EE   (one node, one edge — the "active" recall path)
    mute    #94A3B8   (secondary edges / dot grid)

  Designed to stay legible at 16 px (favicon).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Inter, ui-sans-serif, system-ui, sans-serif">

  <!-- ============== background (just for preview, transparent in export) ============== -->
  <rect width="720" height="360" fill="#FFFFFF"/>

  <!-- ============== Variant 1: lockup (mark + wordmark) ============== -->
  <g transform="translate(40,80)">

    <!-- mark: 3-node graph forming an 'n' -->
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- left leg -->
      <line x1="22" y1="22" x2="22" y2="98" stroke="#0B1220" stroke-width="10"/>
      <!-- arch / right leg -->
      <path d="M 22 38 Q 22 22 38 22 L 78 22 Q 94 22 94 38 L 94 98"
            stroke="#0B1220" stroke-width="10"/>
      <!-- accent edge: the 'active recall' path across the top -->
      <line x1="32" y1="22" x2="84" y2="22" stroke="#22D3EE" stroke-width="10"/>
    </g>
    <!-- nodes -->
    <circle cx="22"  cy="98" r="9" fill="#0B1220"/>
    <circle cx="94"  cy="98" r="9" fill="#0B1220"/>
    <circle cx="58"  cy="22" r="11" fill="#22D3EE"/>

    <!-- wordmark -->
    <g transform="translate(150,0)">
      <text x="0" y="80" font-size="96" font-weight="700"
            letter-spacing="-3" fill="#0B1220">nizo</text>
      <text x="232" y="80" font-size="96" font-weight="300"
            letter-spacing="-2" fill="#22D3EE">.ai</text>
    </g>
  </g>

  <!-- ============== divider ============== -->
  <line x1="40" y1="200" x2="680" y2="200" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ============== Variant 2: mark only (use as favicon / app icon) ============== -->
  <g transform="translate(60,235)">
    <rect x="-10" y="-10" width="100" height="100" rx="22" fill="#0B1220"/>
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="16" y1="20" x2="16" y2="68" stroke="#FFFFFF" stroke-width="7"/>
      <path d="M 16 32 Q 16 20 28 20 L 56 20 Q 68 20 68 32 L 68 68"
            stroke="#FFFFFF" stroke-width="7"/>
      <line x1="22" y1="20" x2="62" y2="20" stroke="#22D3EE" stroke-width="7"/>
    </g>
    <circle cx="16"  cy="68" r="6" fill="#FFFFFF"/>
    <circle cx="68"  cy="68" r="6" fill="#FFFFFF"/>
    <circle cx="42"  cy="20" r="8" fill="#22D3EE"/>
  </g>

  <!-- ============== Variant 3: wordmark only (no mark, for headers) ============== -->
  <g transform="translate(220,235)">
    <text x="0" y="68" font-size="80" font-weight="700"
          letter-spacing="-3" fill="#0B1220">nizo</text>
    <text x="195" y="68" font-size="80" font-weight="300"
          letter-spacing="-2" fill="#22D3EE">.ai</text>
    <!-- subtle tagline -->
    <text x="2" y="98" font-size="14" font-weight="500"
          letter-spacing="6" fill="#94A3B8">MEMORY  FOR  AGENTS</text>
  </g>

</svg>
