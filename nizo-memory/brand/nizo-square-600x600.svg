<?xml version="1.0" encoding="UTF-8"?>
<!--
  nizo.ai square logo — 600 x 600 (stacked composition).
  Mark centered on top, wordmark centered below. Suits avatar / app-tile
  / OG-image use cases.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"
     font-family="Inter, -apple-system, ui-sans-serif, system-ui, sans-serif">

  <!-- transparent background; swap to dark for an inverted variant -->
  <rect width="600" height="600" fill="#FFFFFF"/>

  <!-- ============== mark, centered horizontally, upper third ============== -->
  <!-- mark intrinsic box 220x220, centered at x=300, top y=110 -->
  <g transform="translate(190,110)">
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- left leg -->
      <line x1="35" y1="35" x2="35" y2="195" stroke="#0B1220" stroke-width="22"/>
      <!-- arch -> right leg -->
      <path d="M 35 70 Q 35 35 70 35 L 150 35 Q 185 35 185 70 L 185 195"
            stroke="#0B1220" stroke-width="22"/>
      <!-- accent edge: active recall path -->
      <line x1="58" y1="35" x2="162" y2="35" stroke="#22D3EE" stroke-width="22"/>
    </g>
    <circle cx="35"  cy="195" r="19" fill="#0B1220"/>
    <circle cx="185" cy="195" r="19" fill="#0B1220"/>
    <circle cx="110" cy="35"  r="24" fill="#22D3EE"/>
  </g>

  <!-- ============== wordmark, centered horizontally, lower third ============== -->
  <g transform="translate(0,470)" text-anchor="middle">
    <text x="300" y="0" font-size="92" font-weight="700"
          letter-spacing="-3" fill="#0B1220">nizo<tspan font-weight="300" fill="#22D3EE">.ai</tspan></text>
    <text x="300" y="38" font-size="14" font-weight="500"
          letter-spacing="7" fill="#94A3B8">MEMORY  FOR  AGENTS</text>
  </g>

</svg>
