  - text: "Global e-commerce / marketplaces: Amazon (US/global), eBay, Etsy, Walmart.com (US); Alibaba (Taobao, Tmall, AliExpress, 1688 — wholesale), JD.com / Jingdong, Pinduoduo / Temu, Xiaohongshu / RedNote (China); Rakuten (Japan), Mercari (JP/US); Coupang (Korea, NYSE-listed); Shopee, Lazada (SEA — Sea Group / Alibaba); Tokopedia / GoTo (Indonesia); Jumia (Africa); MercadoLibre (LATAM, Argentina-origin); Shein (CN-origin global fast-fashion); Wayfair, Chewy, Best Buy (US); ASOS, boohoo, Next (UK); Zalando (DE)."
