  # ═══════════════════════════════════════════════════════════════════════════
  # relationships / family — kinship terms across cultures
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Marital / relationship status: single, dating, in a relationship, exclusive, engaged, married, separated, divorced, widowed, common-law, civil partnership / civil union, domestic partner. Indian context: arranged marriage, love marriage."
    category: relationships
  - text: "Immediate family English: parents (mother / father, mom / dad / mum), spouse (wife / husband / partner), child / kids (son, daughter), siblings (brother, sister, twin — identical / fraternal), only child."
    category: relationships
  - text: "Extended family English: grandparents (grandfather / grandmother, granddad / grandma), great-grandparents, uncle / aunt, niece / nephew, cousin (1st, 2nd, once removed), great-uncle / aunt."
    category: relationships
  - text: "In-laws (English): father / mother / brother / sister / son / daughter-in-law, parents-in-law. Step- (parent / sibling / child) and half- (sibling) for blended families. Adoptive, biological, foster — adoptive mother, biological father, foster parent."
    category: relationships
  - text: "Indian / South Asian kinship terms (precise): paternal grandparents — dada (grandfather), dadi (grandmother). Maternal — nana (grandfather), nani (grandmother). Father's brother — chacha (younger) / tau / taya (elder), wife chachi / tai. Father's sister — bua / phupi, husband phupha. Mother's brother — mama, wife mami. Mother's sister — mausi / masi / khala, husband mausa / khalu. Brother's wife — bhabhi. Sister's husband — jiju / behnoi. Husband's brother — devar / jeth, wife devarani / jethani. Wife's brother — saala (informal), wife saali. South: Tamil — appa / amma (parents), thatha / paati (grandparents), maama (uncle, also father-in-law)."
    category: relationships
  - text: "Pets: dogs (common breeds — Labrador, Golden Retriever, German Shepherd, Husky, Rottweiler, Beagle, Pug, French Bulldog, Pomeranian, Doberman, Indian Pariah / 'Indie'). Cats — Persian, Siamese, Maine Coon, Ragdoll, British Shorthair, Bengal, Indian street cat. Other — fish (goldfish, betta), birds (parakeet / budgie, lovebird, cockatiel, parrot), rabbit, hamster, guinea pig, tortoise, reptiles. 'Furbaby' / 'pet parent' — affectionate framing."
    category: relationships
  - text: "Child milestones (rough age): newborn (0-3 mo), infant (4-12 mo), toddler (1-3 yr), preschool / nursery (3-5), kindergarten / KG (5-6), primary / elementary school (6-11), middle school (11-13), high school / secondary (13-18), college / university (18-22+), gap year. Indian school: Pre-KG / LKG / UKG / 1st-12th std."
    category: relationships

  # ═══════════════════════════════════════════════════════════════════════════
  # dates / time — formats, fiscal years, time conventions
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Date formats by region: ISO 8601 = YYYY-MM-DD (universal, prefer this); US = MM/DD/YYYY (Aug 5 2026 = 8/5/2026); UK / India / EU / Australia = DD/MM/YYYY (5/8/2026); Germany = DD.MM.YYYY (5.8.2026); Japan / Korea / China = often YYYY/MM/DD (2026/8/5). When extracting, prefer ISO 8601."
    category: dates
  - text: "Time formats: 12-hour with AM / PM (US, India, Philippines, much of LATAM); 24-hour / military (most of Europe, Australia, Asia, tech / military / aviation contexts). 'Half nine' is 9:30 in UK English but 8:30 in some European languages — clarify."
    category: dates
  - text: "Recurrence vocabulary: daily, weekly, biweekly / fortnightly (every 2 wk), monthly, bimonthly (ambiguous — every 2 mo OR twice a month), quarterly, semi-annual / biannual (twice / yr) vs biennial (every 2 yr), annual / yearly. Use exact intervals to avoid biannual / biennial confusion."
    category: dates
  - text: "Quarters: Q1 = Jan-Mar, Q2 = Apr-Jun, Q3 = Jul-Sep, Q4 = Oct-Dec (calendar). Indian fiscal year = Apr 1 - Mar 31 (FY26 = Apr 2025 - Mar 2026); US federal FY = Oct 1 - Sep 30; UK = Apr 6 - Apr 5; Japan = Apr 1 - Mar 31; Australia = Jul 1 - Jun 30."
    category: dates
  - text: "Birthday / anniversary dates without a year are recurring annual events. Extract date as MM-DD or full date if year given. 'Mom's 60th birthday December 15' implies birth year ≈ now - 60."
    category: dates
  - text: "Time-of-day phrases (loose): 'early morning' 4-6, 'morning' 6-12, 'midday / noon' ~12, 'afternoon' 12-5, 'evening' 5-9, 'night' 9-12, 'late night' 12-3, 'midnight' 24:00 / 00:00. Indian English often uses 'morning' up to ~10am only, then 'afternoon'."
    category: dates

  # ═══════════════════════════════════════════════════════════════════════════
  # government / identity — IDs, tax, common political structures
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Government identity / tax IDs by country: India — Aadhaar (12-digit biometric), PAN (tax, 10-char), Voter ID, Driving Licence, Passport. US — SSN (9-digit Social Security), state Driver's Licence, Passport. UK — National Insurance number, NHS number (health), Driving Licence. EU — National ID cards in most countries; passport. UAE — Emirates ID. Singapore — NRIC (citizens / PR) / FIN (foreigners). Hong Kong — HKID. Japan — My Number. Korea — Resident Registration Number. Brazil — CPF. Australia — Tax File Number (TFN), Medicare. Canada — SIN (Social Insurance Number)."
    category: government
  - text: "Major democratic systems: parliamentary (India, UK, Canada, Australia, Germany, Japan — head of govt = PM, head of state separate); presidential (US, Brazil, Mexico, S. Korea, Indonesia — President is both head of state and govt); semi-presidential (France, Russia). Federal vs unitary (India / US / Germany / Australia federal; UK / France / Japan unitary). Indian states have CMs (Chief Ministers); US states have Governors."
    category: government
  - text: "Major non-democratic / single-party systems: China (CCP), Vietnam (CPV), Cuba, Laos, North Korea (DPRK). Major monarchies — UK / Commonwealth (constitutional, ceremonial), Japan (constitutional emperor), Spain, Sweden, Norway, Denmark, Netherlands, Belgium, Thailand, Bhutan, Malaysia (rotating). Absolute / semi-absolute — Saudi Arabia, UAE (federation of emirates), Oman, Brunei, Eswatini, Vatican."
    category: government
  - text: "Major political parties (illustrative, no opinion): India — BJP, INC (Congress), AAP, regional (DMK, AIADMK, TMC, SP, RJD, JD-U, Shiv Sena, NCP, BJD, BRS, YSRCP, AIMIM). US — Democratic, Republican. UK — Conservative, Labour, Lib Dem, SNP, Reform, Green. Germany — CDU/CSU, SPD, Greens, FDP, AfD, Linke. France — Renaissance, RN, LFI, LR, PS, EELV. Australia — Liberal/National Coalition, Labor, Greens. Canada — Liberal, Conservative, NDP, Bloc, Greens."
    category: government

