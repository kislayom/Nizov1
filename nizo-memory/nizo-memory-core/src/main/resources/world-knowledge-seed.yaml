    category: religion
  - text: "Religious dietary rules: kosher (Jewish — no pork/shellfish, no mixing meat+dairy); halal (Muslim — no pork/alcohol, ritual slaughter); jain (no root vegetables — onion, garlic, potato — no eggs, no meat); vegetarian (lacto, ovo, lacto-ovo); vegan (no animal products at all); pescatarian (fish ok); Hindu (often vegetarian, no beef even if not). Hare Krishna / ISKCON adherents also avoid root vegetables."
    category: religion
  - text: "Religious fasting practices: Ramadan (Muslim, dawn-to-sunset for ~30 days), Lent (Christian, 40 days before Easter, often abstain from one thing), Navratri (Hindu, fasting/no onion-garlic for 9 days), Karva Chauth (Hindu women, sunrise-to-moonrise), Yom Kippur (Jewish, ~25 hour total fast), Ekadashi (Hindu, 11th day of lunar fortnight)."
    category: religion

