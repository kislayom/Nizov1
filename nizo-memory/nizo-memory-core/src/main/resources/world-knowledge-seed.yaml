  # ═══════════════════════════════════════════════════════════════════════════
  # Mexico — food, culture, companies, people, geography
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Mexico basics: capital Mexico City (CDMX, ~22M metro — largest Spanish-speaking city); population ~130M (2nd-largest Spanish-speaking country after itself globally); currency Mexican peso (MXN); language Spanish + 68 indigenous (Nahuatl largest). Major cities — Guadalajara (Jalisco, tech hub 'Mexican Silicon Valley'), Monterrey (NL, industrial), Puebla, Tijuana (border), Cancún / Playa del Carmen (tourism), Mérida (Yucatán), Oaxaca (cuisine), Querétaro, León."
    category: geography
  - text: "Mexican cuisine fundamentals: tacos (al pastor / carnitas / barbacoa / lengua / asada), tortillas (corn, flour), tamales, quesadillas, enchiladas, chilaquiles (breakfast), pozole, mole (poblano / negro / rojo / verde — complex sauce), guacamole, salsa (roja / verde / habanero), elote / esquites (grilled corn), cochinita pibil (Yucatán), birria (Jalisco — viral as birria tacos), tortas, huaraches, sopes, chiles rellenos. Ingredients — corn, beans, chiles (jalapeño, serrano, habanero, poblano, chipotle — dried jalapeño, ancho — dried poblano), nopales (cactus), epazote, cilantro, lime."
    category: food
  - text: "Mexican drinks: tequila (agave, Jalisco DO, blanco / reposado / añejo), mezcal (smokier, small-batch, Oaxaca heartland), pulque (fermented agave), Corona / Modelo / Tecate / Dos Equis / Pacifico / Victoria / Sol (beers, Grupo Modelo + Heineken Mexico dominate), horchata (rice / cinnamon), agua fresca (jamaica / tamarindo / limón), atole, champurrado (hot corn drink), micheladas (beer cocktail)."
    category: food
  - text: "Major Mexican companies: América Móvil (telecom, Carlos Slim — world's richest at times); Telmex (fixed-line); Grupo Televisa / TelevisaUnivision (media); TV Azteca; Cemex (cement, global); FEMSA (Coca-Cola FEMSA, OXXO convenience — largest LATAM retailer, Heineken stake); Walmex (Walmart de México, largest retailer); Grupo Bimbo (bread — Bimbo, Marinela, Sara Lee US, largest baker globally); Grupo Banorte (banking); BBVA México (largest bank, BBVA Spain subsidiary); Santander México; Banco Azteca; KIO Networks; Mabe (appliances); Gruma (tortillas, Maseca); Alpek, Orbia, Elementia."
    category: companies
  - text: "Mexican cultural icons: cinema — 'Three Amigos' directors Alfonso Cuarón (Gravity, Roma — Oscar), Alejandro González Iñárritu (Birdman, The Revenant — Oscars), Guillermo del Toro (Pan's Labyrinth, Shape of Water — Oscar); Salma Hayek, Gael García Bernal, Diego Luna, Eiza González, Eugenio Derbez, Yalitza Aparicio. Music — Luis Miguel ('El Sol'), Vicente Fernández (1940-2021, ranchera king), Juan Gabriel (1950-2016), Thalía, Paulina Rubio, Maná (rock), Café Tacvba, Molotov, Natalia Lafourcade, Carlos Santana (US-based), Peso Pluma (regional mexicano, 2022+ breakout). Football — Javier 'Chicharito' Hernández, Rafael Márquez, Hugo Sánchez, Raúl Jiménez, Guillermo Ochoa (goalkeeper). Boxing — Canelo Álvarez, Julio César Chávez. Artists — Frida Kahlo (1907-54), Diego Rivera (muralist, 1886-1957)."
    category: famous-people
  - text: "Mexican festivals / culture: Día de los Muertos (Day of the Dead, Nov 1-2, UNESCO heritage — altars 'ofrendas', marigolds 'cempasúchil', sugar skulls 'calaveras' — NOT Halloween), Cinco de Mayo (May 5, Battle of Puebla 1862 — bigger in US than Mexico), Independence Day (Sep 16, 'El Grito'), Guadalupe Day (Dec 12, Virgin of Guadalupe), Las Posadas (Dec 16-24), Epiphany / Three Kings Day (Jan 6, Rosca de Reyes), Quinceañera (girl's 15th birthday coming-of-age). Music/dance — mariachi (UNESCO), banda, ranchera, norteño, cumbia, reggaeton-Latin."
    category: calendar

  # ═══════════════════════════════════════════════════════════════════════════
  # Brazil — Latin America's largest
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Brazil basics: capital Brasília (planned city 1960); largest city São Paulo (~22M metro, financial hub), Rio de Janeiro (tourism, former capital), Belo Horizonte, Salvador (Afro-Brazilian), Fortaleza, Brasília, Curitiba, Porto Alegre, Manaus (Amazon gateway), Recife. Population ~215M (largest Portuguese-speaking country, ~80% of world Portuguese speakers). Currency — Brazilian real (BRL, R$). Language Portuguese (distinct accent from European). States 26 + Federal District."
    category: geography
  - text: "Brazilian cuisine: feijoada (national dish — black bean + pork stew, Saturday lunch), churrasco (BBQ, served rodízio style — continuous service), pão de queijo (cheese bread, Minas Gerais), brigadeiro (chocolate truffle), coxinha (chicken fritter), açaí (bowl, Amazonian), acarajé (Bahia, Afro-Brazilian), moqueca (fish stew — Bahia / Espírito Santo), empadão, pastel, farofa (toasted manioc flour side), tapioca, Brazilian cheese buns, Romeu e Julieta (cheese + guava paste). Drinks — cachaça (sugarcane, base of caipirinha), caipirinha (national cocktail — cachaça + lime + sugar), guaraná (soda brand Antarctica / Brahma), Brahma / Skol / Antarctica / Itaipava (beers, Ambev dominant), cafezinho (coffee), chimarrão (mate, south)."
    category: food
  - text: "Major Brazilian companies: Petrobras (state oil, one of world's largest); Vale (iron ore, mining giant); Itaú Unibanco (largest private LATAM bank); Bradesco (banking); Banco do Brasil (state); Santander Brasil; Nubank / Nu Holdings (largest digital bank in LATAM, NYSE-listed); JBS (world's largest meat processor); BRF (Sadia, Perdigão — chicken); Ambev (brewer — ABInBev subsidiary, Brahma, Skol, Antarctica, Stella Artois BR); Natura (cosmetics, acquired Avon); Embraer (aircraft, 3rd-largest after Boeing/Airbus for regional jets); MercadoLibre (Argentine HQ, Brazil biggest market); iFood (food delivery); Magazine Luiza (retail); Via (Casas Bahia + Ponto)."
    category: companies
  - text: "Brazilian cultural icons: football GOATs — Pelé (1940-2022, 3 World Cups), Ronaldo 'Il Fenomeno' / R9 (2002 WC), Ronaldinho (2005 Ballon d'Or), Kaká, Rivaldo, Romário, Zico, Sócrates, Garrincha, Neymar Jr, Vinicius Jr, Rodrygo, Raphinha, Endrick, Alisson, Marquinhos, Casemiro. F1 — Ayrton Senna (1960-94, 3x champion), Emerson Fittipaldi, Nelson Piquet, Felipe Massa. Music — Tom Jobim (bossa nova, 'Girl from Ipanema'), Vinicius de Moraes, João Gilberto, Gilberto Gil, Caetano Veloso, Gal Costa, Jorge Ben Jor, Chico Buarque, Seu Jorge, Anitta (global pop), Pabllo Vittar, Luan Santana. Cinema — Fernando Meirelles (City of God), Walter Salles (Central Station, Motorcycle Diaries), José Padilha. Models — Gisele Bündchen, Adriana Lima, Alessandra Ambrosio. UFC — Anderson Silva, Vitor Belfort, Minotauro, Lyoto Machida."
    category: famous-people
  - text: "Brazilian festivals / culture: Carnival (Carnaval, week before Lent — Rio Sambódromo most famous, also Salvador street-style, Recife / Olinda frevo) — biggest party on Earth. Festa Junina (June — country folk festival, bonfires, quadrilha dance). New Year — white clothes at Copacabana. Religions — majority Catholic, growing Evangelical (Pentecostal), Afro-Brazilian syncretic (Candomblé, Umbanda — Orixás). Indigenous heritage. Capoeira — Afro-Brazilian martial art + dance (UNESCO). Samba, bossa nova, MPB, funk carioca (baile funk), sertanejo (country), forró, axé. Soap operas 'telenovelas' via Globo dominate TV culture."
    category: calendar

  # ═══════════════════════════════════════════════════════════════════════════
  # Latin America — Argentina, Colombia, Peru, Chile, others
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Argentina basics: capital Buenos Aires (~15M metro); population ~46M; currency peso (ARS, high inflation historically); language Spanish (rioplatense accent, vos vs tú); known for beef, Malbec wine, tango, dulce de leche, mate tea (ritual drink). Football — Messi (2022 WC), Maradona, Di María, Julián Álvarez, Enzo Fernández. F1 — Juan Manuel Fangio (1911-95, 5x champ). Tennis — Guillermo Vilas, Gabriela Sabatini, Juan Martín del Potro. Rock en español roots — Soda Stereo, Charly García, Fito Páez. Politics — Javier Milei (president since 2023, libertarian). Writers — Jorge Luis Borges, Julio Cortázar, Adolfo Bioy Casares. Pope Francis (Jorge Bergoglio, Argentine)."
    category: geography
  - text: "Colombia / Andean / Pacific LATAM basics: Colombia (pop 52M, capital Bogotá; Medellín, Cali, Cartagena — tourism, coffee axis; currency COP; language Spanish; known — Shakira, Gabriel García Márquez (1927-2014, Nobel Lit, magical realism), Fernando Botero (artist), James Rodríguez, Radamel Falcao, Luis Díaz; reggaeton / Latin pop — Karol G, J Balvin, Maluma, Juanes; Narcos / Pablo Escobar legacy; coffee — Juan Valdez). Peru (Lima capital, currency PEN — sol; Machu Picchu, Inca heritage; cuisine — ceviche, lomo saltado, anticuchos, pisco sour; Pisco brandy). Chile (Santiago; CLP; copper mining — Codelco; wine — Concha y Toro, Casillero del Diablo; Isabel Allende, Pablo Neruda, Alexis Sánchez). Venezuela (Caracas, bolívar VES, oil crisis / diaspora; arepas). Bolivia (La Paz + Sucre, BOB — boliviano). Ecuador (Quito, USD dollarized). Uruguay (Montevideo, UYU — peso; Luis Suárez, Edinson Cavani, Forlán). Paraguay (Asunción, PYG — guaraní)."
    category: geography
  - text: "Latin American cuisine highlights beyond Mexico / Brazil: Argentine — asado (BBQ), empanadas (regional variations), chimichurri (herb sauce for beef), milanesa (breaded cutlet), alfajor (cookie with dulce de leche), Malbec wine, Fernet con Coca. Peru — ceviche (raw fish cured in citrus, national dish — UNESCO), lomo saltado (Chinese-Peruvian stir-fry), ají de gallina, causa, anticuchos (beef heart skewers), pisco sour. Colombia — arepa (corn cake, vs Venezuela's), bandeja paisa (big platter), ajiaco (chicken-potato soup), empanadas, sancocho. Venezuela — arepa (stuffed), pabellón criollo. Cuban — ropa vieja (shredded beef), Cuban sandwich, mojito, Cuba libre, black beans + rice. Puerto Rican — mofongo, pernil, tostones. Nicaraguan — gallo pinto."
    category: food
  - text: "Latin music genres: reggaeton (Puerto Rico-origin — Daddy Yankee, Don Omar, Tego Calderón, pioneers; current era — Bad Bunny 'Benito', J Balvin, Karol G, Rauw Alejandro, Ozuna, Anuel AA), Latin trap, Latin pop (Shakira, Enrique Iglesias, Ricky Martin, Luis Fonsi — 'Despacito'), reggaeton-pop crossover, bachata (DR — Aventura, Romeo Santos, Prince Royce), salsa (Puerto Rico / Cuba / NYC — Marc Anthony, Héctor Lavoe, Willie Colón, Celia Cruz), merengue (DR), cumbia (Colombia-origin, pan-LATAM), vallenato (Colombia — Carlos Vives), samba / bossa nova (BR), tango (AR / UY), Andean folk, Cuban son, timba, Norteño + banda (NW Mexico), regional mexicano resurgence."
    category: famous-people

  # ═══════════════════════════════════════════════════════════════════════════
  # Southeast Asia — Indonesia, Vietnam, Philippines, Thailand, Malaysia
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Indonesia basics: capital Jakarta (moving to Nusantara on Borneo, 2024-ongoing); population ~280M (4th globally, largest Muslim-majority); currency rupiah (IDR); Bahasa Indonesia language. Major cities — Surabaya, Bandung, Medan, Semarang, Makassar, Denpasar (Bali). Archipelago — 17K+ islands, Java most populous, Bali tourism, Sumatra, Sulawesi, Kalimantan (Borneo), Papua. Islam ~87% + Hindu Bali + Christian minorities. Key companies — Astra International (conglomerate), Bank Mandiri / BCA / BRI / BNI, GoTo Group (Gojek + Tokopedia), Blibli, Grab (SG-listed), Telkom Indonesia, Indofood (Indomie instant noodles — global)."
    category: geography
  - text: "Indonesian cuisine: nasi goreng (fried rice — national dish), mie goreng (fried noodles), rendang (slow-braised beef — World's 50 Best), sate / satay (skewers — ayam, kambing), gado-gado (veg + peanut), bakso (meatball soup), soto (spiced soup — ayam / betawi), nasi padang (Minangkabau — array of dishes), gudeg (Yogya — young jackfruit), rawon (black beef soup), martabak (sweet / savory), kopi (coffee — luwak, gayo, toraja — major exporter), sambal (chili paste, many regional variants), tempeh (fermented soy — Indonesian origin), krupuk (prawn crackers). Balinese — babi guling (roast pig), lawar."
    category: food
  - text: "Philippines basics: capital Manila (Metro Manila / NCR ~14M); population ~115M; currency peso (PHP); languages — Filipino / Tagalog + English (official), + ~180 regional (Cebuano, Hiligaynon, Ilocano). Archipelago 7K+ islands — Luzon (north, Manila), Visayas (central — Cebu, Boracay, Bohol), Mindanao (south — Davao, Muslim majority southwest). Catholic majority (~80%). Major cities — Quezon City, Cebu, Davao, Makati (financial), BGC (tech). Companies — SM Investments (retail, malls), Ayala Corp (conglomerate), JG Summit / Gokongwei, San Miguel Corp (beer + more), Jollibee Foods (global fried-chicken chain, iconic), GCash / Mynt (fintech, Globe), Maya, Globe Telecom, PLDT. Famous — Manny Pacquiao (boxing), Lea Salonga (singer, Miss Saigon / Mulan), Catriona Gray (Miss Universe 2018), Jose Rizal (national hero, executed 1896), Ferdinand Marcos Sr (dictator 1965-86), Bongbong Marcos (president 2022-)."
    category: geography
  - text: "Filipino cuisine: adobo (national dish — soy + vinegar braise, usually chicken / pork), sinigang (sour tamarind soup), lechon (whole roasted pig, fiesta centerpiece), kare-kare (peanut stew), pancit (noodles — bihon / canton / palabok), lumpia (spring rolls), kaldereta, bulalo, tapsilog (breakfast — tapa + sinangag + itlog: cured beef + garlic rice + egg — silog combos), balut (fertilized duck egg — acquired taste), halo-halo (shaved ice dessert), leche flan, ube (purple yam, global trend), turon, bibingka, puto. Beer — San Miguel Pale Pilsen / Red Horse. Coconut wines — lambanog, tuba."
    category: food
  - text: "Vietnam basics: capital Hanoi (north); population ~100M; largest city Ho Chi Minh City (formerly Saigon, south, ~9M); currency dong (VND); language Vietnamese (Latin-script with diacritics). Rapidly growing economy. Companies — Vingroup (conglomerate — VinFast EVs, VinHomes real estate, Vinpearl tourism), Viettel (telecom, military-owned), VNG (tech / games), FPT (IT services), Techcombank, Vietcombank, Masan (food / retail), Vinamilk (dairy), VietJet Air. Famous — Ho Chi Minh (revolutionary, 1890-1969), General Võ Nguyên Giáp."
    category: geography
  - text: "Vietnamese cuisine: phở (noodle soup — bò beef / gà chicken, national dish), bánh mì (baguette sandwich — legacy of French colonialism), gỏi cuốn (fresh spring rolls with peanut sauce), chả giò (fried spring rolls), bún chả (grilled pork + noodles, Hanoi — made famous by Obama/Bourdain), bún bò Huế (spicy beef noodle), cao lầu (Hoi An), cơm tấm (broken rice + grilled pork), bánh xèo (savory crêpe), nước mắm (fish sauce — fundamental), Vietnamese coffee (cà phê sữa đá — drip over condensed milk + ice, egg coffee Hanoi specialty). Beer — Bia Hà Nội, Bia Saigon, 333."
    category: food
  - text: "Thailand basics: capital Bangkok (~11M metro, 'Krung Thep'); population ~70M; currency baht (THB); language Thai (own script). Theravada Buddhist ~90%. Constitutional monarchy — King Vajiralongkorn (Rama X). Cities — Chiang Mai (north, digital-nomad hub), Phuket (beach), Pattaya, Krabi, Koh Samui. Companies — CP Group / Charoen Pokphand (ag + retail, owns 7-Eleven Thailand), PTT (oil + gas), Bangkok Bank, SCB (Siam Commercial), Kasikornbank, Thai Beverage (ThaiBev, Chang beer), Central Group (Centara hotels, retail), Airports of Thailand, True Corp (telecom), AIS, DTAC. Famous — Muay Thai (national sport), Blackpink's Lisa (Lalisa Manobal, Thai)."
    category: geography
  - text: "Thai cuisine: pad thai (stir-fried rice noodles, national), tom yum goong (sour-spicy shrimp soup), tom kha gai (coconut-chicken soup), green / red / massaman / panang curry, som tam (green papaya salad, Isaan), larb (meat salad, Isaan / Lao), khao pad (fried rice), pad see ew, pad krapow moo (minced pork + basil over rice, everyday lunch), kuay teow (noodle soups), sticky rice + mango dessert, roti, Thai iced tea (orange, condensed milk). Spice dimensions — spicy / sour / sweet / salty balance. Beer — Singha, Chang, Leo. Whisky — SangSom."
    category: food
  - text: "Malaysia + Singapore basics: Malaysia — capital Kuala Lumpur (KL, Petronas Twin Towers), Putrajaya (admin capital); pop ~33M; currency ringgit (MYR); languages Malay + English + Chinese (Mandarin / Hokkien / Cantonese) + Tamil; Muslim majority ~60%, sizeable Chinese ~23% + Indian ~7%; constitutional monarchy (rotating kings). Major cities — George Town (Penang — food), Johor Bahru (border SG), Kota Kinabalu (Borneo). Companies — Petronas (oil), Maybank (largest SEA bank by assets), CIMB, Public Bank, AirAsia / Capital A (Tony Fernandes), Genting (casinos, resorts), YTL, Sime Darby, Axiata. Singapore — covered extensively already (SG basics: city-state pop 6M, capital is the country; SGD; multilingual — English / Mandarin / Malay / Tamil)."
    category: geography
  - text: "Malay / Singaporean / Peranakan cuisine: nasi lemak (coconut rice + sambal + anchovies + egg — Malaysian national dish, also Singaporean), nasi goreng, roti canai (flaky flatbread + curry, Malay take on Indian paratha), char kway teow (stir-fried flat noodles, hawker classic), Hainanese chicken rice (Singapore national dish), laksa (coconut-curry noodle — Penang asam laksa vs Singapore curry laksa), chili crab (Singapore iconic), satay (with peanut sauce), rendang (Indonesian origin, popular across), Peranakan / Nyonya fusion (Chinese-Malay) — laksa, ayam buah keluak, otak-otak, kueh. Kopitiam / hawker-center culture. Teh tarik (pulled tea). Durian (king of fruits)."
    category: food

  # ═══════════════════════════════════════════════════════════════════════════
  # Africa — major nations
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Nigeria basics: most populous African country (~225M); federal capital Abuja (planned, 1991); largest city Lagos (~22M metro, commercial capital); currency naira (NGN, high inflation); ~500 languages, English official (+ Pidgin English widespread), Hausa / Yoruba / Igbo major. Oil-dominated economy (Niger Delta). Major companies — Dangote Group (Aliko Dangote — cement, sugar, refinery — Africa's largest), MTN Nigeria (telecom), Airtel Africa, GTCO (Guaranty Trust), Zenith, Access Bank, UBA, First Bank of Nigeria, Flutterwave (fintech, global), Paystack (acquired by Stripe), Andela (tech talent). Nollywood — world's 2nd-largest film industry by volume after Bollywood. Music — Afrobeats global wave: Burna Boy (Grammy), Wizkid, Davido, Rema, Tems, Asake, Fela Kuti (1938-97, Afrobeat pioneer). Football — Jay-Jay Okocha, Nwankwo Kanu, Victor Osimhen. Authors — Chinua Achebe (Things Fall Apart), Wole Soyinka (Nobel Lit 1986), Chimamanda Ngozi Adichie."
    category: geography
  - text: "South Africa basics: 3 capitals — Pretoria (executive), Cape Town (legislative), Bloemfontein (judicial); largest city Johannesburg / Joburg ('Egoli'); population ~60M; currency rand (ZAR); 11 official languages (English + Zulu + Xhosa + Afrikaans largest). Post-apartheid since 1994 (Mandela). BRICS member. Companies — Naspers (Tencent stake, Prosus), Anglo American (mining), MTN Group (telecom, pan-Africa), Standard Bank, FirstRand (FNB), Absa, Nedbank, Sasol (petrochemicals), Discovery (insurance), Shoprite, Pick n Pay, Woolworths SA. Sport — rugby (Springboks — WC 2019, 2023), cricket (Proteas), football (Bafana Bafana). Famous — Nelson Mandela (1918-2013), F.W. de Klerk, Desmond Tutu, Charlize Theron (actress, Oscar), Trevor Noah, Elon Musk (born Pretoria), J.M. Coetzee (Nobel Lit), Nadine Gordimer (Nobel). Cyril Ramaphosa (president since 2018)."
    category: geography
  - text: "Kenya / East Africa basics: Kenya — capital Nairobi (tech hub 'Silicon Savannah'), pop ~54M, currency shilling (KES), Swahili + English official (Kiswahili pan-East African). Companies / innovation — Safaricom (M-Pesa — mobile money, pioneered 2007, copied globally), Equity Bank, KCB, Kengen, East African Breweries (Tusker). Famous — Jomo Kenyatta (first president), Wangari Maathai (Nobel Peace 2004), Lupita Nyong'o (Oscar, Kenyan-Mexican), Eliud Kipchoge (marathon GOAT, sub-2 hour). Tanzania — Dar es Salaam commercial, Dodoma capital, Swahili, Kilimanjaro, Serengeti, Zanzibar (Freddie Mercury's birthplace). Uganda — Kampala, Museveni (long-ruling). Rwanda — Kigali, Kagame, post-1994 genocide recovery story, tech-forward. Ethiopia — Addis Ababa, Birr (ETB), ancient Christian kingdom + Injera bread, coffee birthplace, Abiy Ahmed (Nobel Peace 2019)."
    category: geography
  - text: "North Africa / Middle East deeper: Egypt — capital Cairo (metro ~22M, largest in ME/Africa), Alexandria; population ~112M; currency pound (EGP); Arabic; Suez Canal + pyramids / Nile / Sphinx. Companies — CIB (bank), Orascom, Fawry (fintech). Famous — Gamal Abdel Nasser, Anwar Sadat (1978 peace w/ Israel), Hosni Mubarak, Abdel Fattah el-Sisi (current), Naguib Mahfouz (Nobel Lit 1988), Omar Sharif (actor), Mohamed Salah (football). Morocco — Rabat capital, Casablanca commercial, Marrakech tourism, Fez, Tangier; dirham MAD; Arabic + Berber + French; tagine, couscous; King Mohammed VI. Algeria — largest by area in Africa; Algiers; dinar DZD. Tunisia — Tunis; dinar TND. Turkey (ME / E Med) — Istanbul (straddles Europe / Asia), Ankara capital, pop ~85M, lira TRY (recent high inflation); Erdoğan; kebab, döner, baklava, Turkish coffee; companies — Turkish Airlines (biggest network globally), Koç / Sabancı / Eczacıbaşı holdings, Trendyol, Getir (founded, now struggling). Iran — Tehran, Persian / Farsi, rial IRR, sanctions-bound; Shia majority; saffron, rice, kebabs; Omar Khayyam (poet, math). Israel — Jerusalem (contested) / Tel Aviv (tech / financial); shekel ILS; Hebrew + Arabic; 'Startup Nation' — Mobileye (Intel), Check Point, CyberArk, Wix, Monday.com, Waze."
    category: geography

  # ═══════════════════════════════════════════════════════════════════════════
  # Nordics / Eastern Europe / Oceania / Canada
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Nordic countries basics: Sweden — capital Stockholm; krona SEK; companies — IKEA (furniture, global icon), H&M, Volvo Cars (Geely-owned), Ericsson (telecom infra), Spotify, Klarna, King (Candy Crush), Skype (origin), Minecraft / Mojang (acq. Microsoft), ABBA, Ingvar Kamprad (IKEA founder), Greta Thunberg (climate activist). Norway — Oslo; krone NOK; Equinor (oil), sovereign wealth fund largest globally ($1.7T+); Anders Behring Breivik (2011 attack), Edvard Munch (The Scream), Karl Ove Knausgård. Denmark — Copenhagen; krone DKK; Lego, Maersk (shipping, largest container), Novo Nordisk (Ozempic/Wegovy, GLP-1 boom), Carlsberg, Ørsted (wind), Pandora (jewelry), Hans Christian Andersen. Finland — Helsinki; euro (EUR); Nokia (former phones, now network infra), Supercell (Clash of Clans), Rovio (Angry Birds), KONE (elevators), sauna culture. Iceland — Reykjavík; króna ISK; Björk, fishing + geothermal."
    category: geography
  - text: "Eastern Europe + Russia + Central Asia: Poland — capital Warsaw; złoty PLN; largest Central Euro economy, fast-growing; CD Projekt Red (Witcher, Cyberpunk 2077), Allegro (e-commerce), PKO Bank Polski, InPost; Robert Lewandowski, Chopin (composer), Lech Wałęsa. Czech Republic / Czechia — Prague; koruna CZK; ŠKODA Auto (VW group), Pilsner Urquell, Avast / Norton. Hungary — Budapest; forint HUF; OTP Bank, MOL oil, Richter Gedeon pharma, Viktor Orbán. Romania — Bucharest; leu RON; UiPath (RPA, NYSE). Ukraine — Kyiv; hryvnia UAH; 2022 Russian invasion ongoing; Zelensky (president, former comedian); grain exports. Russia — Moscow / St. Petersburg; ruble RUB; Gazprom, Rosneft, Lukoil, Sberbank, Yandex (now split East/West), Putin (leader since 2000). Central Asia — Kazakhstan (Astana / Nur-Sultan, tenge KZT, Kazmunaigas oil), Uzbekistan (Tashkent, som UZS), Kyrgyzstan, Turkmenistan, Tajikistan."
    category: geography
  - text: "Oceania beyond AU: New Zealand — capital Wellington; largest Auckland; population ~5M; currency NZD; Maori indigenous + English; All Blacks rugby (haka), Lord of the Rings filming, kiwi fruit + bird, Peter Jackson, Russell Crowe, Neil Finn, Taika Waititi, Jacinda Ardern (PM 2017-23). Pacific Islands — Fiji (Suva), Samoa, Tonga, Papua New Guinea (Port Moresby — PNG, pop ~10M), Solomon Islands, Vanuatu, New Caledonia (French), French Polynesia (Tahiti). Rugby / sevens dominance."
    category: geography
  - text: "Canada deeper: capital Ottawa; largest city Toronto (financial hub, ~6M metro), Montreal (Québec — French), Vancouver (BC, Pacific, high cost), Calgary (oil), Edmonton, Ottawa; population ~40M; currency CAD; languages English + French (Québec). Provinces 10 + 3 territories. Companies — Royal Bank of Canada (RBC, largest), TD Bank, Bank of Montreal (BMO), Scotiabank, CIBC; Shopify (Tobi Lütke, Ottawa); Enbridge, TC Energy (pipelines); Suncor, Canadian Natural (oil sands); Bombardier (former jets, now trains); Alimentation Couche-Tard (Circle K convenience, global); Tim Hortons (coffee + donuts, RBI-owned); Lululemon (yoga apparel, Vancouver). Famous — Justin Trudeau (PM 2015-), Wayne Gretzky (hockey GOAT), Céline Dion, Drake, The Weeknd, Bryan Adams, Alanis Morissette, Neil Young, Leonard Cohen, Jim Carrey, Ryan Reynolds, Ryan Gosling, Margaret Atwood, Alice Munro (Nobel Lit)."
    category: geography
  - text: "China deeper (under-sampled so far): capital Beijing; largest city Shanghai; pop ~1.4B; currency yuan / renminbi (CNY / RMB); Mandarin official + Cantonese / Wu / Min / Hakka. CCP / Xi Jinping leadership. Companies — state giants: ICBC, CCB, ABC, BOC (4 big banks), Sinopec, PetroChina, China Mobile, CNOOC. Tech — Alibaba (Jack Ma, Taobao / Tmall / Ant / Cainiao), Tencent (WeChat, QQ, games — Riot Games, PUBG Mobile stake), ByteDance (TikTok / Douyin), Meituan (food delivery + more), JD.com, Pinduoduo / Temu, Baidu (search + AI), Didi (ride-hail), NetEase (games), Xiaomi (phones + IoT), Huawei, Honor, Oppo, Vivo, Realme, BYD (EVs, overtook Tesla), Nio, XPeng, Li Auto, Lenovo (PCs), Haier (appliances), DJI (drones), CATL (batteries), Shein, Temu. Famous — Jack Ma, Pony Ma, Robin Li, Jensen Huang (NVIDIA, born Taipei), Jackie Chan, Jet Li, Lang Lang (piano), Yao Ming (NBA), Li Na (tennis). Historic — Confucius, Sun Tzu (Art of War), Mao, Deng. Language hint — simplified (mainland) vs traditional (Taiwan, HK) characters."
    category: geography
  - text: "Japan deeper: capital Tokyo (~37M metro, world's largest); Osaka / Kyoto / Nagoya / Yokohama / Sapporo / Fukuoka major; pop ~124M, declining; currency yen (JPY); Japanese (3 scripts — hiragana / katakana / kanji). Constitutional monarchy — Emperor Naruhito (Reiwa era 2019-). Companies — Toyota (world's largest automaker by volume), Honda, Nissan, Suzuki, Mazda, Subaru; Sony (PlayStation, music, pictures, sensors), Nintendo (Switch, Mario, Zelda, Pokémon), Panasonic, Sharp, Hitachi, Mitsubishi Heavy, Mitsubishi UFJ, Mizuho, SMBC (finance); Fast Retailing (Uniqlo, GU), SoftBank (Masayoshi Son — Vision Fund), Keyence, Recruit, Rakuten, Line (Korea-JP), NTT, KDDI, NEC, Fujitsu. Culture — anime (Studio Ghibli Miyazaki, Shinkai), manga (Shōnen Jump — One Piece, Naruto, Dragon Ball), J-pop, city pop, Kitaro. Famous — Akira Kurosawa, Takeshi Kitano, Hiroyuki Sanada, Ryuichi Sakamoto, Yoko Ono. Cuisine — sushi / ramen / tempura / yakitori / wagyu / kaiseki / izakaya / omakase."
    category: geography
  - text: "Korea (South) deeper: capital Seoul (~26M metro); Busan / Incheon / Daegu / Gwangju major; population ~52M; currency won (KRW); Korean / Hangul script. Companies — Samsung Group (Samsung Electronics — world's largest memory, phones, TVs; Samsung C&T, Samsung Life — via Samsung chairman Lee family), Hyundai Motor Group (Hyundai / Kia / Genesis / Hyundai Mobis / Hyundai Heavy, shipbuilding), SK Group (SK Hynix — memory, SK Telecom, SK Innovation / batteries), LG Group (LG Electronics, LG Chem, LG Energy Solution), Lotte, POSCO (steel), Naver (portal + Line), Kakao (KakaoTalk messenger, taxis, pay), Coupang (NYSE, e-commerce), Krafton (PUBG). K-pop / K-drama — already covered. Cinema — Bong Joon-ho (Parasite Oscar), Park Chan-wook, Lee Chang-dong. Squid Game / K-dramas global. Cuisine — Korean BBQ (galbi, bulgogi), kimchi (fermented cabbage — UNESCO), bibimbap, tteokbokki (spicy rice cakes), samgyeopsal (pork belly), kimbap, ramyeon (Shin Ramyun), Korean fried chicken + beer 'chimaek', soju, makgeolli."
    category: geography

  # ═══════════════════════════════════════════════════════════════════════════
  # everyday-services — food delivery, e-commerce, banking, productivity apps
  # across regions (so the agent understands user context by region)
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Food delivery apps by region: India — Swiggy (+ Instamart quick commerce), Zomato (+ Blinkit), Dunzo (struggling). US — DoorDash (leader), Uber Eats, Grubhub, Postmates (Uber), Instacart (grocery). UK — Deliveroo, Just Eat (Takeaway.com), Uber Eats. EU — Just Eat Takeaway, Glovo (Spain), Wolt (Finland, acq. DoorDash), Flink. China — Meituan (dominant), Ele.me (Alibaba). SE Asia — GrabFood, Foodpanda, Gojek GoFood. Japan — Uber Eats, Demae-can, Wolt. Korea — Baedal Minjok ('Baemin'), Yogiyo, Coupang Eats. Latin America — Rappi (Colombia-origin pan-LATAM), iFood (Brazil), PedidosYa. Middle East — Talabat, Careem Food, Deliveroo UAE, HungerStation (Saudi), Jahez. Africa — Jumia Food (exited 2023), Glovo, Bolt Food."
    category: everyday-services
  - text: "Quick commerce / 10-min grocery by region: India — Blinkit (Zomato), Zepto, Swiggy Instamart, BigBasket BB Now, Tata BB Now, Flipkart Minutes, Amazon Now / Fresh. US — Gopuff, Getir (exited US 2024), FreshDirect, Amazon Fresh, Whole Foods delivery. UK — Getir, Gorillas (acq. Getir, exited), Zapp. Turkey — Getir (origin). Germany / EU — Flink, Gorillas, Getir. Latin America — Rappi Turbo, Jokr. Middle East — Kitopi (cloud kitchens), Nana (Saudi). China — Dingdong Maicai, Missfresh. Philosophy: 10-30 min delivery, dark-store model, razor-thin margins, ongoing consolidation 2023-25."
    category: everyday-services
  - text: "Ride-hailing + super-apps globally: Uber (US — rides, Eats, freight — most countries). Lyft (US / CA only). India — Ola, Uber, Rapido (bikes + autos), BluSmart (EV), Meru (legacy). China — Didi Chuxing (dominant post-Uber exit), Shenzhou Zhuanche, Caocao. SE Asia — Grab (SG-based, rides + food + fintech super-app), Gojek (Indonesia, merged into GoTo with Tokopedia), Maxim (Russia-origin, in Indonesia). Middle East — Careem (Uber subsidiary, regional super-app — rides + food + pay + bikes). Latin America — Cabify (Spain, LATAM heavy), 99 (Brazil, Didi-owned), inDrive (negotiable fares). Russia — Yandex Taxi / Yandex Go. Europe — Bolt (Estonia, pan-European + Africa), FreeNow (BMW / Daimler JV, Europe), Heetch (France). Africa — Bolt, Uber, inDrive, Yango (Yandex). Australia — Uber, Ola, DiDi, Shebah."
    category: everyday-services
  - text: "Digital wallets / payment apps by region: India — UPI layer (BHIM) + apps: Google Pay (PhonePe-chasing #1), PhonePe (Walmart-owned, largest), Paytm (first-mover, lost share), Amazon Pay, Mobikwik, CRED (CC bills + premium), Bharat Interface (BHIM). US — Apple Pay, Google Wallet, Venmo (PayPal), Cash App (Block / Square), Zelle (bank-built). UK / EU — Apple / Google Pay dominant, Revolut, Wise (remittance), Monzo / Starling / N26 (neobanks), Klarna (BNPL). China — Alipay (Ant / Alibaba), WeChat Pay (Tencent) — duopoly controls >90% mobile payments. Japan — PayPay (SoftBank), Rakuten Pay, LINE Pay, Suica (transit card, everyday use). Korea — KakaoPay, Naver Pay, Samsung Pay, Toss (fintech super-app). SE Asia — GrabPay, GCash (Philippines, dominant), Maya / PayMaya, MoMo (Vietnam), DANA / OVO (Indonesia), TrueMoney (Thailand), DuitNow / Touch 'n Go (Malaysia). Latin America — Mercado Pago (MercadoLibre), Nubank, PicPay (Brazil), Pix (BR's instant-payment rails, not an app), CoDi (Mexico). Middle East — Careem Pay, STC Pay (Saudi), Tabby / Tamara (BNPL)."
    category: everyday-services
  - text: "Neobanks / digital banks: US — Chime (leader), Current, Varo, SoFi, Ally (online legacy). UK / EU — Revolut (UK-origin, global), Monzo, Starling (UK), N26 (Germany), Wise (former TransferWise — remittance-first), Bunq (Netherlands). India — Jupiter, Fi Money, Niyo, Slice, Fampay (teens), Open (SMB). Latin America — Nubank (Brazil, largest digital bank globally, NYSE), Inter, C6 (Brazil), Ualá (Argentina), Nequi (Colombia, Bancolombia). SE Asia — GXS (Grab / Singtel), Trust (Standard Chartered SG), MariBank (SG, Sea), Tyme (SA / Philippines), ANEXT (Singapore). Korea — KakaoBank, K-Bank, Toss Bank. Turkey — Enpara."
    category: everyday-services
  - text: "E-commerce / marketplaces supplementary: India — Flipkart (Walmart), Amazon IN, Myntra, AJIO, Meesho (social resell), Snapdeal, JioMart, Tata Cliq, Nykaa (beauty leader), Nykaa Fashion, Koskii / Kalki (ethnic), Lenskart (eyewear), FirstCry (kids), boAt (audio), Mamaearth / Honasa, Purplle (beauty). Livestream commerce — Shop101, Trell (closed). Resale — Cashify (used phones), Spinny / Cars24 / CarDekho (used cars). Kids — FirstCry, Hopscotch. Rental — Rentomojo, Furlenco. Grocery — BigBasket, Grofers (→ Blinkit), JioMart, DMart Ready. Electronics — Croma (Tata), Reliance Digital. Fashion — Myntra, AJIO, Tata Cliq Luxury, Nykaa Fashion, Limeroad."
    category: everyday-services
  - text: "Global travel booking apps: Booking.com (NL, largest hotels globally), Airbnb (homes / experiences), Expedia (+ Hotels.com, Vrbo, Trivago, Orbitz, Travelocity), Agoda (Asia-focus, Booking subsidiary), Trip.com (Ctrip, China / global), Tripadvisor (reviews), Skyscanner (flights, Ctrip-owned), Kayak (Booking), Google Flights, Momondo. India — MakeMyTrip (largest), Goibibo (MMT group), Yatra, EaseMyTrip, Cleartrip (Flipkart), Ixigo, RedBus (bus, Ixigo), ConfirmTkt (rail). China — Trip.com / Ctrip, Qunar, Fliggy (Alibaba), Tongcheng. Asia — Traveloka (Indonesia), Klook (HK — experiences), GetYourGuide (DE — experiences). Middle East — Wego (regional aggregator). Short-term rentals — Vrbo, OYO (India-origin, global-struggling), Airbnb."
    category: everyday-services
  - text: "Productivity / note-taking apps: Notion (all-in-one, Notion AI), Obsidian (local markdown, PKM), Roam Research (networked notes), Logseq (open-source Roam-like), Apple Notes (default iCloud), Google Keep, Microsoft OneNote, Evernote (legacy), Bear (Mac / iOS), Craft, Reflect, Mem (AI), Amplenote, Tana (AI PKM), Scrintal, Heptabase. Task / project — Todoist, Things 3 (iOS / Mac, beautiful), OmniFocus (GTD), TickTick, Any.do, Microsoft To Do, Google Tasks. Project mgmt — Asana, Trello (Atlassian), Monday, ClickUp, Linear (engineering-focus), Jira (Atlassian), Height, Shortcut, Basecamp. Calendar — Google Cal, Outlook, Apple Cal, Fantastical (Mac), Cron / Notion Calendar (acquired), Amie."
    category: everyday-services
  - text: "Messaging + communication: WhatsApp (Meta, ~3B MAU, dominant India / EU / LATAM / ME / Africa). iMessage (Apple, US-heavy). Telegram (Dubai-based, channels + bots, popular EE / ME / SEA / crypto). Signal (E2E, privacy-focused, non-profit). WeChat (Weixin, China — super-app). LINE (Japan / Taiwan / Thailand / Indonesia). KakaoTalk (Korea dominant). Viber (Rakuten — former popular, declining). Discord (gaming + communities). Slack (workplace, Salesforce). Microsoft Teams (enterprise). Zoom (video meetings). Google Meet. Webex (Cisco). Skype (shutting down 2025, replaced by Teams). Zulip, Mattermost (OSS Slack-alternatives). Twist, Basecamp Campfire."
    category: everyday-services
  - text: "Dating apps globally: Match Group owns — Tinder (global leader), Hinge ('designed to be deleted'), OkCupid, Match.com, Meetic (EU), PlentyOfFish, Azar. Bumble Inc — Bumble (women-first), Badoo, Fruitz. Others — Coffee Meets Bagel, The League (exclusive), Grindr (LGBTQ men), HER (lesbian / queer), Scruff (men). India — Shaadi.com, BharatMatrimony, Jeevansaathi (arranged-marriage sites); Aisle, TrulyMadly, Bumble IN. China — Tantan (acq. by Momo), Momo, Soul, Blued (gay). Japan — Pairs, Omiai, Tapple, Tinder. Korea — Amanda (Korea), Glam, Noondate. Muslim / religious — Muzz (Muslim), Christian Mingle, JSwipe (Jewish), JDate. Friend-finding — Bumble BFF, Peanut (moms)."
    category: everyday-services
  - text: "Streaming / subscription economy: video — Netflix / Disney+ / Prime / Max / Apple TV+ / Hulu / Peacock + regional (Hotstar, JioCinema, iQIYI, etc.). Music — Spotify / Apple Music / YouTube Music / Tidal + regional. News — NYT, WSJ, FT, Bloomberg, Economist, The Athletic (NYT), Substack (newsletters — Platformer, Stratechery, Lenny's), Medium. Audio — Spotify Podcasts, Apple Podcasts, Overcast, Pocket Casts, Audible (audiobooks), Blinkist (summaries). Fitness — Peloton (bike + app), Nike Training Club, Strava (run / cycle social), Apple Fitness+, Whoop (strap), Oura (ring), Garmin Connect, Fitbit (Google). Cloud storage — iCloud+, Google One, Dropbox, OneDrive, pCloud, Backblaze (backup)."
    category: everyday-services

  # ═══════════════════════════════════════════════════════════════════════════
  # cinema — film franchises, industries, awards, anime
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Major Hollywood franchises: Marvel Cinematic Universe (MCU — 30+ films, Avengers, Iron Man, Spider-Man, Black Panther, Guardians, Thor, Captain America, Doctor Strange, Wakanda Forever, Deadpool, Eternals, Ms Marvel — Disney since 2009 acquisition), DC Extended Universe / DCU (Batman, Superman, Wonder Woman, Aquaman, Joker), Star Wars (Lucasfilm — Disney owned — Skywalker saga 9 films + The Mandalorian, Andor), Harry Potter / Wizarding World (8 + Fantastic Beasts), Lord of the Rings + Hobbit + Rings of Power (Tolkien), James Bond / 007 (28 films, Eon Productions), Mission Impossible (Tom Cruise, 7+), Fast & Furious (10+), John Wick, Jurassic Park / World, Jason Bourne, Indiana Jones, Pirates of the Caribbean, Transformers, Avatar (Cameron — top-grossing), Toy Story / Pixar (Inside Out, Up, Coco, Ratatouille, WALL-E, Finding Nemo), DreamWorks (Shrek, Kung Fu Panda, How to Train Your Dragon), Despicable Me / Minions (Illumination)."
    category: cinema
  - text: "Indian film industries (regional names): Bollywood (Hindi, Mumbai-based, largest by worldwide reach); Tollywood (Telugu, Hyderabad — Baahubali, RRR, Pushpa global); Kollywood (Tamil, Chennai — Rajinikanth, Vijay, Kamal Haasan); Mollywood (Malayalam, Kerala — known for art cinema, Mohanlal, Mammootty, Fahadh); Sandalwood (Kannada, Bangalore — KGF, Kantara global); Pollywood (Punjabi); Bhojpuri film industry (UP / Bihar); Bengali (Tollygunge — Satyajit Ray legacy); Marathi; Gujarati; Assamese; Odia; Konkani. Indian Film Industry collectively largest in the world by # of films produced (~2,000+/yr)."
    category: cinema
  - text: "Other major film industries: Nollywood (Nigeria — 2nd largest by volume, low-budget straight-to-video tradition + theatrical now); Korean cinema / 'K-cinema' (Bong Joon-ho — Parasite Oscar 2020, Park Chan-wook — Oldboy, Lee Chang-dong, Kim Ki-duk, Hong Sang-soo); Japanese cinema (Akira Kurosawa — Seven Samurai / Rashomon, Yasujirō Ozu, Hirokazu Kore-eda — Shoplifters Cannes, Hayao Miyazaki — Studio Ghibli); Chinese cinema (Zhang Yimou — Hero, Wong Kar-wai HK — In the Mood for Love, Ang Lee — Crouching Tiger / Brokeback / Life of Pi); French New Wave + auteur tradition (Truffaut, Godard, Agnès Varda, recent — Olivier Assayas, Justine Triet — Anatomy of a Fall); Italian — Fellini, De Sica, Sorrentino (Great Beauty); Spanish — Almodóvar; Iranian — Abbas Kiarostami, Asghar Farhadi (A Separation Oscar); Mexican — Cuarón / Iñárritu / del Toro (covered)."
    category: cinema
  - text: "Anime / manga essentials: studios — Studio Ghibli (Miyazaki — Spirited Away Oscar, Totoro, Princess Mononoke, Howl's), Toei (Dragon Ball, Sailor Moon, One Piece), MAPPA (Attack on Titan finale, Jujutsu Kaisen, Chainsaw Man), Ufotable (Demon Slayer / Kimetsu no Yaiba, Fate), Kyoto Animation / KyoAni, Shaft, Bones, Wit Studio, Madhouse, Sunrise (Gundam), Trigger, A-1 Pictures. Iconic series — Naruto, Bleach, Attack on Titan, One Piece, Death Note, Fullmetal Alchemist, Cowboy Bebop, Neon Genesis Evangelion, Ghost in the Shell, Akira (1988 film), Spirited Away, Your Name (Shinkai), Demon Slayer, Jujutsu Kaisen, Chainsaw Man, Spy x Family, Frieren. Genres — shōnen (boys, action), shōjo (girls, romance), seinen (adult men), josei (adult women), isekai (transported world), mecha, slice-of-life. Manga vs anime: manga = comic source; reading right-to-left."
    category: cinema
  - text: "Major film awards: Academy Awards / Oscars (US, since 1929 — Best Picture / Director / Acting / etc.), Golden Globes (HFPA, US, separate film + TV), BAFTA (UK), SAG Awards (US actors guild), Critics Choice, Independent Spirit. Festivals — Cannes (France, May, Palme d'Or top prize), Venice (Italy, Aug-Sep, Golden Lion, oldest), Berlinale / Berlin (Feb, Golden Bear), Sundance (US, Jan, indie), TIFF Toronto (Sep), Telluride (US niche), Tribeca (NYC), SXSW (Austin). Indian — National Film Awards (govt), Filmfare (private, oldest popular), Star Screen, IIFA (international), SIIMA (south), Zee Cine. Asian — Busan IFF (Korea), Tokyo IFF, Hong Kong IFF, Shanghai IFF. Latin — Goya (Spain), Fênix (Iberoamerican), Berlin's Forum / Encounters."
    category: cinema

  # ═══════════════════════════════════════════════════════════════════════════
  # music — genres, instruments, classical, jazz, hip-hop, electronic, regional
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Major Western music genres: rock (classic, hard, prog, alt, indie, punk, metal — heavy / thrash / death / black / nu / metalcore), pop, hip-hop / rap, R&B / soul, country (Nashville, bluegrass, alt-country, country pop), folk, blues, jazz (bebop, cool, fusion, smooth, free), electronic (house, techno, trance, drum & bass, dubstep, EDM, ambient), reggae, ska, gospel, Christian contemporary, classical, opera, soundtrack / score, lo-fi, hyperpop, emo, post-rock, shoegaze, indie folk, grunge, new wave, synth-pop."
    category: music
  - text: "Western classical composers (eras): Baroque — J.S. Bach, Handel, Vivaldi, Telemann (~1600-1750). Classical — Mozart, Haydn, Beethoven (transitional, ~1750-1820). Romantic — Schubert, Chopin, Liszt, Mendelssohn, Schumann, Brahms, Wagner, Tchaikovsky, Mahler, Verdi, Puccini (~1820-1900). Modern / 20th c. — Debussy, Ravel, Stravinsky (Rite of Spring), Schoenberg (atonal), Bartók, Shostakovich, Rachmaninoff, Sibelius, Prokofiev, Britten, Copland, Bernstein. Minimalists — Steve Reich, Philip Glass, John Adams, Arvo Pärt. Film composers — John Williams (Star Wars / Indiana Jones / Jurassic), Hans Zimmer (Inception / Interstellar / Dune / Lion King), Ennio Morricone (1928-2020), Howard Shore (LOTR), James Newton Howard, Alan Silvestri."
    category: music
  - text: "Indian classical music: 2 main systems — Hindustani (North) and Carnatic (South). Hindustani performers — Pt. Ravi Shankar (sitar — Beatles influence), Anoushka Shankar, Ustad Vilayat Khan, Ustad Allauddin Khan, Pt. Bhimsen Joshi (vocal), Kishori Amonkar, Shivkumar Sharma (santoor, 1938-2022), Hariprasad Chaurasia (bansuri / flute), Zakir Hussain (tabla, 1951-2024), Ustad Bismillah Khan (shehnai, 1916-2006), Pt. Nikhil Banerjee. Carnatic — M.S. Subbulakshmi, T.M. Krishna, Aruna Sairam, U. Srinivas (mandolin), Bombay Jayashri, Kunnakudi Vaidyanathan, Lalgudi Jayaraman. Concepts — raga (melodic framework), tala (rhythm cycle), gharana (lineage), khayal / dhrupad (Hindustani forms), kriti / varnam (Carnatic forms). Instruments — sitar, sarod, sarangi, santoor, veena (Saraswati / Rudra), mridangam, tabla, ghatam, bansuri / venu, shehnai, harmonium, tanpura, kanjira."
    category: music
  - text: "Jazz history + icons: roots in New Orleans early 1900s (Louis Armstrong — trumpet / vocals). Swing era (Duke Ellington, Count Basie, Glenn Miller, Benny Goodman, Ella Fitzgerald). Bebop (Charlie Parker — sax, Dizzy Gillespie — trumpet, Thelonious Monk — piano, Bud Powell, Max Roach — drums). Cool jazz (Miles Davis — Kind of Blue is THE jazz album, Chet Baker, Dave Brubeck — Take Five). Hard bop (Art Blakey, Horace Silver, Cannonball Adderley). Modal / free / avant — John Coltrane (A Love Supreme, Giant Steps), Ornette Coleman, Eric Dolphy, Sun Ra. Fusion (Miles late, Herbie Hancock — Headhunters, Weather Report, Mahavishnu Orchestra — John McLaughlin + Indian fusion, Chick Corea, Pat Metheny). Vocalists — Billie Holiday, Sarah Vaughan, Nina Simone, Ella, Frank Sinatra, Tony Bennett. Indian fusion / 'Jazz fusion' — Trilok Gurtu, Louiz Banks, U. Shrinivas. Modern — Robert Glasper, Esperanza Spalding, Kamasi Washington, GoGo Penguin, Snarky Puppy, Hiromi Uehara (JP)."
    category: music
  - text: "Hip-hop / rap evolution: Old school (1979-84) — Sugarhill Gang, Grandmaster Flash, Run-DMC. Golden age (mid-80s to mid-90s) — Public Enemy, N.W.A. (Dr. Dre, Eazy-E, Ice Cube), LL Cool J, Wu-Tang Clan, A Tribe Called Quest, Nas (Illmatic 1994), The Notorious B.I.G., 2Pac (1971-96), Snoop Dogg, OutKast. Late 90s / 2000s — Eminem, JAY-Z, Kanye West, 50 Cent, Lil Wayne, Missy Elliott, Lauryn Hill, Mos Def, Common. 2010s+ — Drake, Kendrick Lamar (Pulitzer 2018), J. Cole, Travis Scott, Migos, Cardi B, Nicki Minaj, Future, 21 Savage, Tyler the Creator, Doja Cat, Lil Nas X, Post Malone (genre-blur), Megan Thee Stallion. UK grime / drime — Stormzy, Skepta, Dave, Central Cee. Indian — Divine, Naezy (gully rap, basis of Gully Boy), Raftaar, Badshah, KR$NA, Seedhe Maut, MC Stan, Honey Singh (legacy), Diljit Dosanjh (Punjabi crossover), AP Dhillon. Latin — Bad Bunny, J Balvin, Karol G (covered)."
    category: music
  - text: "Electronic / EDM scene: house (Chicago origin — Frankie Knuckles), techno (Detroit — Juan Atkins, Derrick May), trance (Goa origin influences, Tiësto, Armin van Buuren, Above & Beyond, Paul van Dyk), drum & bass / DnB (UK — Pendulum, Sub Focus, Andy C), dubstep (UK — Skrillex US, Excision), garage / 2-step / UK garage (Disclosure modern), big-room / festival EDM (David Guetta, Calvin Harris, Martin Garrix, Hardwell, Steve Aoki, Marshmello, The Chainsmokers), progressive house (Eric Prydz, Anjunabeats), tech house (Solomun, Black Coffee — SA, Carl Cox), minimal techno (Berlin — Berghain). Festivals — Tomorrowland (Belgium, biggest), Ultra Music Festival (Miami, also IN / KR / etc.), EDC, Coachella (multi-genre, US), Glastonbury (UK), Lollapalooza (US, IN, BR), Sunburn (India), Sensation, Awakenings, ADE (Amsterdam Dance Event). Indian electronic — Nucleya, Ritviz, Su Real, Lifafa."
    category: music
  - text: "Other regional music traditions: Latin / reggaeton already covered. Arabic / MENA — Umm Kulthum (1898-1975, Egyptian icon), Fairuz (Lebanese), Amr Diab (Egypt), Mohammed Abdu (Saudi), maqam system (modal, microtonal). Turkish — sufi, classical, arabesque (Ibrahim Tatlises), pop (Sezen Aksu, Tarkan). Persian / Iranian — Mohammad Reza Shajarian (1940-2020), Hayedeh, Googoosh, modern Iranian rap underground. African — Afrobeats (Burna Boy, Wizkid, Davido, Tems), Amapiano (South Africa, late 2010s), Highlife (Ghana / Nigeria), Soukous (Congo — Papa Wemba), Mbalax (Senegal — Youssou N'Dour), Afro-Cuban / salsa roots, gospel (S. Africa Ladysmith Black Mambazo). Caribbean — reggae (Bob Marley, Peter Tosh), dancehall (Sean Paul, Vybz Kartel), soca (Trinidad), calypso. Celtic — Enya, The Chieftains, Riverdance. World fusion — Buena Vista Social Club, Gipsy Kings, Manu Chao."
    category: music
  - text: "Common musical instruments: keyboard — piano (acoustic / digital), grand piano, upright, organ, synthesizer, MIDI controller, harmonium (Indian). Strings — guitar (acoustic, classical / nylon, electric, bass), violin / fiddle, viola, cello, double bass, harp, ukulele, mandolin, banjo, sitar / sarod / veena (Indian). Wind — flute (transverse, recorder, bansuri), clarinet, oboe, saxophone (alto / tenor / baritone / soprano), trumpet, trombone, French horn, tuba, harmonica, accordion, bagpipes, shehnai. Percussion — drum kit (bass / snare / hi-hat / toms / cymbals), timpani, xylophone, marimba, vibraphone, tabla, mridangam, ghatam, djembe, congas, bongos, cajón, tambourine, maracas. Modern — turntable / DJ deck, drum machine, sampler, DAW (Ableton, Logic, FL Studio, Pro Tools)."
    category: music

  # ═══════════════════════════════════════════════════════════════════════════
  # hobbies — sports-to-play, indoor / outdoor activities, collecting
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Common participation sports — racquet: tennis, badminton, table tennis / ping-pong, squash, padel (booming Spain / LATAM / India / ME), pickleball (US fastest-growing 2020s, racquet hybrid). Cue — pool / billiards, snooker (UK / India), carrom (S. Asia). Team — football / soccer, basketball, cricket, baseball, softball, volleyball (indoor, beach), American football, rugby, hockey (field — India strong, ice — N. Am / N. Eu), kabaddi (S. Asia, PKL pro league), kho-kho (India), netball (Commonwealth)."
    category: hobbies
  - text: "Endurance + outdoor sports: running (5K, 10K, half-marathon, marathon — Boston / NYC / London / Berlin / Tokyo / Chicago Big 6, ultras), trail running, cycling (road, mountain / MTB, gravel, BMX, Tour de France / Giro / Vuelta — pro), triathlon (Olympic, sprint, half / 70.3 Ironman, full Ironman 140.6), swimming (pool, open-water), hiking, trekking (Himalayan — EBC base camp, Annapurna; Inca Trail, Camino de Santiago, Mt Kilimanjaro, Kumano Kodo Japan), backpacking, mountaineering, climbing (sport, trad, bouldering, indoor — V-grade / French / Yosemite scales), via ferrata, kayaking / canoeing, SUP (stand-up paddleboard), surfing, kitesurfing, windsurfing, sailing, diving (scuba — PADI / SSI certifications, free diving), snorkeling. Winter — skiing (alpine / cross-country / freestyle), snowboarding, ice skating, ice hockey, curling, sled / luge."
    category: hobbies
  - text: "Studio / fitness practices: gym / weightlifting / strength training, CrossFit, HIIT, Pilates (mat, reformer), yoga (Hatha, Ashtanga, Vinyasa, Iyengar, Bikram / hot, Yin, Restorative, Kundalini), barre, spin / SoulCycle / Peloton, Zumba (dance fitness), aerobic / step, calisthenics, Olympic lifting, powerlifting (squat / bench / deadlift), bodybuilding, kettlebell, TRX, functional, mobility / stretching, foam rolling, sound healing, breathwork."
    category: hobbies
  - text: "Martial arts: karate (Japan — Shotokan, Goju, Wado, Shito), judo (Japan, Olympic), aikido (Japan), kendo (Japan), kung fu / wushu (China — Shaolin, Wing Chun, Tai Chi), Brazilian Jiu-Jitsu / BJJ (Gracie family), Muay Thai (Thailand), Krav Maga (Israel), Sambo (Russia), Capoeira (Brazil), Taekwondo (Korea, Olympic), Hapkido (Korea), Boxing (Western), Kickboxing, Mixed Martial Arts / MMA — UFC (US, Dana White) / ONE Championship (SEA / Singapore) / Bellator / PFL. Indian — Kalaripayattu (Kerala, ancient), Gatka (Sikh), Silambam (Tamil)."
    category: hobbies
  - text: "Indoor games / hobbies: chess (Magnus Carlsen, Indian wave — Anand, Gukesh, Praggnanandhaa, Vidit, Erigaisi, chess.com / lichess online), Go / Weiqi / Baduk (East Asia, AlphaGo defeated Lee Sedol 2016), shogi (Japan), xiangqi (Chinese chess), checkers / draughts, backgammon, mahjong (Chinese, Japanese variants), Scrabble, Bananagrams, Wordle (NYT viral 2022), crosswords / sudoku / KenKen, jigsaw puzzles. Card games — bridge (contract bridge, club / duplicate), poker (Texas Hold'em, Omaha — WSOP), rummy (gin, Indian), 29 / Kot (S. India), Mendicot, teen patti (Indian, festive), bluff, hearts, spades, solitaire / klondike. Tabletop / board — Monopoly, Catan / Settlers of Catan, Risk, Pandemic, Ticket to Ride, Scythe, Wingspan, Carcassonne, Codenames, Dungeons & Dragons / D&D (TTRPG), Pathfinder, Warhammer 40K (miniatures)."
    category: hobbies
  - text: "Creative / craft hobbies: photography (DSLR, mirrorless — Sony Alpha / Canon R / Nikon Z / Fujifilm, film revival, smartphone, street, portrait, landscape, wildlife, astro), videography / vlogging, painting (oil, acrylic, watercolor, gouache, ink, digital — Procreate / Photoshop), drawing / sketching (pencil, charcoal, pen, ink, comic, manga style), calligraphy (Western, Arabic, Chinese, Japanese, Devanagari, modern brush), pottery / ceramics (wheel-thrown, hand-built, raku, glazing), woodworking, knitting, crochet, embroidery (cross-stitch, sashiko, Japanese boro, Indian zardozi / kantha / chikankari), sewing / quilting, cross-stitch, scrapbooking, origami (Japanese paper folding), bookbinding, leatherworking, jewelry-making (silver, beading, resin), candle-making, soap-making, terrarium-building. Music — learning piano / guitar / drums / vocals, songwriting, home recording, DJing."
    category: hobbies
  - text: "Outdoor / nature hobbies: gardening (vegetable, ornamental, native, hydroponic, raised-bed, container, balcony), composting, urban farming, fishing (freshwater, saltwater, fly), hunting (where legal), birdwatching / birding (eBird app, Merlin), foraging (mushroom hunting — caution!), beekeeping (apiculture), camping (tent, glamping, vanlife / RV), fossicking, geocaching, stargazing / amateur astronomy (telescopes — Celestron, Sky-Watcher; apps — SkySafari, Stellarium), landscape painting plein-air, mountain biking, gravel cycling, equestrian / horse riding, polo, archery, shooting / target / clay pigeon, paintball, airsoft."
    category: hobbies
  - text: "Collecting hobbies: stamps (philately), coins (numismatics), banknotes (notaphily), watches (vintage Rolex, Patek, Omega, Speedmaster, Submariner, Daytona; modern — Tudor, Grand Seiko, microbrands), sneakers (Nike Jordans, Yeezys, Dunks, Adidas Samba, New Balance 550 / 990, ASICS Gel-1130, StockX / GOAT secondary market), trading cards (Pokémon, Magic the Gathering / MTG, Yu-Gi-Oh, sports — Topps / Panini), comic books (CGC graded, Marvel / DC, Tintin, Asterix, Diamond Comics India), vinyl records (Discogs marketplace), cassette / CD revival, books (first editions, signed), art / prints (Christie's / Sotheby's), wine (Bordeaux, Burgundy, Napa, Italian), whiskey (single malts — Macallan, Yamazaki, Indian — Amrut, Paul John), antiques, classic cars, model trains, militaria, fountain pens (Montblanc, Pelikan, Lamy, Pilot, Indian Bril)."
    category: hobbies
  - text: "Reading / podcast / video subcultures: bibliophiles, BookTok / Bookstagram, Goodreads, Storygraph, audiobook listeners (1.5x / 2x speed common), serial fiction (Royal Road, Wattpad), fanfiction (AO3 — Archive of Our Own); podcast genres — true crime (Serial, Crime Junkie), comedy, news (Daily, Up First), business / startup (Acquired, How I Built This, This Week in Startups, All-In, Lenny's), tech (Stratechery, The Vergecast, Decoder, Hard Fork), self-improvement (Tim Ferriss, Lex Fridman), sports, music interview, wellness (Huberman Lab — Andrew Huberman); YouTube creators / formats — Mr. Beast, video-essay (Lindsay Ellis, ContraPoints, Hbomberguy), tech (MKBHD, Linus Tech Tips, JerryRigEverything), gaming streamers (Twitch — xQc, Asmongold, Pokimane, Kai Cenat), Indian — CarryMinati, Bhuvan Bam, Tanmay Bhat, Samay Raina, Ranveer Allahbadia / 'BeerBiceps'."
    category: hobbies
  - text: "Dance forms: Western — ballet (classical Russian / Vaganova / Royal / ABT / Bolshoi), contemporary, jazz, modern, hip-hop (b-boying / breaking — Olympic 2024 debut), tap, salsa (Cuban, NY1, LA), bachata, kizomba, swing (Lindy Hop, Charleston), waltz, tango (Argentine), flamenco (Spain), Irish stepdance (Riverdance), African / Afrobeats. Indian classical — Bharatanatyam (Tamil), Kathak (North), Kathakali (Kerala), Mohiniyattam (Kerala), Kuchipudi (AP), Odissi (Odisha), Manipuri (NE), Sattriya (Assam). Indian folk — bhangra (Punjab), garba / dandiya (Gujarat — Navratri), lavani (Maharashtra), ghoomar (Rajasthan), bihu (Assam). K-pop dance covers, TikTok / IG dance trends."
    category: hobbies

  # ═══════════════════════════════════════════════════════════════════════════
  # lifestyle-brands — fashion, beauty, home, watches, athletic
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Luxury fashion houses (LVMH-owned in parens): Louis Vuitton (LVMH), Dior (LVMH), Chanel (independent, Wertheimer family), Hermès (independent, Birkin / Kelly bags), Gucci (Kering), Prada, Miu Miu (Prada), Saint Laurent / YSL (Kering), Bottega Veneta (Kering), Balenciaga (Kering), Versace (Capri Holdings), Valentino, Givenchy (LVMH), Fendi (LVMH), Celine (LVMH), Loewe (LVMH), Burberry (UK), Alexander McQueen (Kering), Tom Ford (Estée Lauder), Ralph Lauren (premium-luxury), Brunello Cucinelli (Italian quiet luxury), Loro Piana (LVMH, cashmere), Moncler (puffer), Stone Island, Maison Margiela, Off-White (LVMH stake — Virgil Abloh legacy), Jacquemus, Khaite, The Row (Olsen twins, quiet luxury icon)."
    category: lifestyle-brands
  - text: "Premium / contemporary fashion: Hugo Boss, Tommy Hilfiger, Calvin Klein (PVH owns both), Lacoste, Polo Ralph Lauren, Diesel, Ted Baker, Fred Perry, Coach (Tapestry), Kate Spade (Tapestry), Michael Kors (Capri), Tory Burch, COS (H&M premium), Arket, Massimo Dutti (Inditex), Reiss, Sandro, Maje (SMCP), Theory, Vince. Streetwear — Supreme (VF Corp), Stüssy, Palace (UK), Fear of God, Essentials (Fear of God diffusion), A Bathing Ape / BAPE (JP), Comme des Garçons (Rei Kawakubo), Yeezy (former adidas-Kanye), Yohji Yamamoto (JP), Issey Miyake (JP)."
    category: lifestyle-brands
  - text: "Fast fashion + mass: Zara (Inditex, ES — fastest-cycle pioneer), H&M (Sweden, 2nd), Uniqlo (Fast Retailing, JP — 'LifeWear' positioning), Forever 21, Mango (ES), Bershka / Pull&Bear / Stradivarius / Massimo Dutti / Zara Home / Oysho (all Inditex), Primark (UK), Topshop (acq. ASOS), River Island, New Look. Online-only fast — SHEIN (Chinese global, ultra-fast), Boohoo, PrettyLittleThing, Fashion Nova, Romwe. Indian — Westside (Tata Trent), Pantaloons (Aditya Birla), Reliance Trends, Max Fashion (Landmark), W for Women, Aurelia, AND, Global Desi (Anita Dongre). Indian premium / occasion — Manyavar (Vedant Fashions), Mohey, Anita Dongre, Sabyasachi (luxury bridal), Ritu Kumar, Tarun Tahiliani, FabIndia (handloom heritage), Good Earth, Nicobar, Bombay Shirt Co."
    category: lifestyle-brands
  - text: "Athletic / activewear: Nike (largest globally, Jordan brand sub-line), Adidas (DE — 3-stripes, Yeezy era ended 2022), Puma (DE), Under Armour (US), Reebok (former Adidas, sold to ABG), New Balance (US — 990, 550, 1906, 9060 hype), ASICS (JP — Gel-1130, Kayano), Mizuno (JP), HOKA (running, max-cushion), On Running (Swiss, On Cloud), Brooks (running), Saucony, Salomon (FR — XT-6 trail / lifestyle hype). Yoga / studio — Lululemon (Canada — Align leggings), Alo (LA), Vuori (US), Outdoor Voices, Athleta (Gap), Sweaty Betty (Wolverine). Outdoor — Patagonia (env-focused), The North Face (VF), Arc'teryx (Amer Sports — gorpcore icon), Columbia, Marmot, Rab, Mountain Hardwear, REI Co-op, Decathlon (FR — value, owns Quechua / Domyos / Triban / Kalenji), Black Diamond (climbing). Indian — Decathlon dominant, Adidas, Nike strong, Domyos local."
    category: lifestyle-brands
  - text: "Watches by tier: Haute horlogerie (top) — Patek Philippe (Nautilus, Calatrava, Aquanaut), Audemars Piguet (Royal Oak), Vacheron Constantin, A. Lange & Söhne, Breguet, Jaeger-LeCoultre (JLC — Reverso), Richard Mille (skeletonised modern). Luxury — Rolex (Submariner, Daytona, GMT-Master, Datejust, Day-Date 'President', Explorer, Sky-Dweller), Omega (Speedmaster — moonwatch, Seamaster — Bond), Cartier (Tank, Santos, Ballon Bleu), IWC (Pilot, Portugieser), Panerai, Hublot, Tag Heuer (Carrera, Monaco), Tudor (Rolex sister — Black Bay). Mid — Grand Seiko (JP, Spring Drive), Seiko (5 sport, Prospex), Citizen, Tissot (PRX), Longines, Oris, Hamilton, Frederique Constant, Christopher Ward (UK micro). Affordable — Casio (G-Shock — Mudmaster, MR-G, A158 'Casioak'), Timex, Swatch (X Omega MoonSwatch viral), Indian — Titan (Tata — sub-brands Sonata, Fastrack, Nebula, Edge, Raga; Xylys premium). Smart — Apple Watch (Series 10, Ultra), Garmin (Fenix, Forerunner, Epix), Samsung Galaxy Watch, Google Pixel Watch, Whoop (no display), Oura Ring."
    category: lifestyle-brands
  - text: "Beauty / skincare brands: Luxury — La Mer (Estée Lauder), SK-II (P&G — Pitera), La Prairie, Sisley, Augustinus Bader, Dr. Barbara Sturm, Tom Ford Beauty, Chanel Beauty, Dior Beauty, Guerlain (LVMH). Premium / mass — L'Oréal (largest globally), Lancôme, YSL Beauty, Maybelline, Garnier, Kiehl's (L'Oréal); Estée Lauder, Clinique, MAC, Bobbi Brown, Smashbox, Aveda, Origins (EL); Sephora (LVMH retail); Charlotte Tilbury, Pat McGrath (artist-founded). K-beauty — Sulwhasoo, Laneige (Amorepacific), Innisfree, Etude House, COSRX, Beauty of Joseon, Anua, Some By Mi, Klairs, Dr. Jart+. J-beauty — Shiseido, SK-II, Hada Labo, DHC, Tatcha. Indie / efficacy — The Ordinary (Deciem), CeraVe (L'Oréal — viral), La Roche-Posay, Vichy, Avène, Bioderma (Fr pharmacy). Indian — Lakmé (HUL), Lotus Herbals, Biotique, Himalaya, Forest Essentials (luxury Ayurveda), Kama Ayurveda, Mamaearth (Honasa), Plum, mCaffeine, Sugar Cosmetics, Nykaa-owned brands, Pilgrim. Clean / ethical — Drunk Elephant, Tata Harper, REN, Youth To The People, Glow Recipe, Saie, Ilia, RMS Beauty, Iris&Romeo."
    category: lifestyle-brands
