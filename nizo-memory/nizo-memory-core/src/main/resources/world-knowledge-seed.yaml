  - text: "Visa / immigration concepts (general): visa-free / visa-on-arrival (VOA), e-visa, embassy visa, multiple-entry, single-entry, transit, business, tourist, student, work, dependent / spouse, residency permit, permanent residency / PR, citizenship / passport. India-specific terms — OCI (Overseas Citizen of India, lifelong visa for foreign nationals of Indian origin), PIO (now merged into OCI), NRI (Non-Resident Indian — tax-residency status, not immigration), Aadhaar (does not affect citizenship). Common visa programs — US H-1B (work, lottery), L-1 (intra-company transfer), O-1 (extraordinary ability), F-1 (student), J-1 (exchange), B-1/B-2 (business / tourist), EB-5 (investor), Green Card (permanent residency); UK Skilled Worker / Health & Care / Innovator / Global Talent / High Potential Individual; AU subclass 482 / 186 / 189; Canada Express Entry / PNP / Start-Up Visa; Singapore EP / S Pass / PR; Schengen visa (29-country EU travel); UAE Golden Visa; Portugal D7 / Digital Nomad. ESTA (US visa-waiver, online, ~$21), ETA (UK 2024+), eTA Canada / Australia."
    category: travel
  - text: "Major hotel chains by tier: Luxury / 5-star — Aman, Four Seasons, Mandarin Oriental, Bulgari Hotels (LVMH), Ritz-Carlton (Marriott), St. Regis (Marriott), W (Marriott), Park Hyatt, Andaz (Hyatt), Conrad (Hilton), Waldorf Astoria (Hilton), JW Marriott, Edition (Marriott), Rosewood, Belmond (LVMH), Six Senses (IHG), Banyan Tree, Capella, Soneva (Maldives), Aman, Bulgari, Cheval Blanc (LVMH). Indian luxury — Taj (Tata IHCL — Taj Mahal Palace Mumbai iconic), Oberoi, ITC Hotels, Leela. Japanese — Hoshinoya, Park Hyatt Tokyo, Aman Tokyo. Premium / 4-star — Marriott, Hilton, Hyatt Regency, Sheraton (Marriott), Westin (Marriott), Renaissance (Marriott), Le Méridien (Marriott), Crowne Plaza (IHG), DoubleTree (Hilton), Sofitel (Accor), Pullman (Accor), Novotel (Accor), Mövenpick (Accor), Marriott Courtyard, Hilton Garden Inn, Hyatt Place. Budget / mid — Holiday Inn (IHG), Hampton (Hilton), Fairfield (Marriott), Ibis (Accor), Premier Inn (UK), Travelodge (UK), Comfort Inn (Choice), Best Western, Days Inn, Motel 6. Indian budget — OYO Rooms (also global), Treebo, FabHotels, Lemon Tree, Ginger (Tata)."
    category: travel
  - text: "Hotel groups (parent companies): Marriott International (largest globally — Ritz-Carlton, St. Regis, W, JW, Westin, Sheraton, Le Méridien, Marriott, Renaissance, Courtyard, Fairfield, Residence Inn, Element, AC Hotels, Aloft, Edition, Bulgari Hotels, Moxy + Bonvoy loyalty); Hilton Worldwide (Waldorf, Conrad, Hilton, DoubleTree, Hampton, Embassy, Curio, Tapestry + Honors loyalty); IHG / InterContinental Hotels Group (InterContinental, Crowne Plaza, Holiday Inn, Holiday Inn Express, Six Senses, Regent, Kimpton, Hotel Indigo, Voco + IHG One Rewards); Hyatt Hotels (Park Hyatt, Grand Hyatt, Hyatt Regency, Hyatt Centric, Andaz, Alila, Miraval + World of Hyatt); Accor (Sofitel, Pullman, Novotel, Mövenpick, Mercure, Ibis, Raffles, Fairmont, Banyan Tree partnership + ALL — Accor Live Limitless); Wyndham, Choice, Best Western, Radisson Hotel Group. Indian — IHCL / Taj, EIH / Oberoi, ITC, Lemon Tree."
    category: travel
  - text: "Top global tourist destinations / sights: Europe — Eiffel Tower (Paris), Colosseum (Rome), Sagrada Família (Barcelona), Big Ben + Tower Bridge (London), Acropolis (Athens), Brandenburg Gate (Berlin), Anne Frank House (Amsterdam), Plitvice Lakes (Croatia), Northern Lights (Iceland / Norway / Finland), Santorini (Greece), Cinque Terre (Italy), Hallstatt (Austria), Neuschwanstein (Germany). Asia — Taj Mahal (Agra), Great Wall + Forbidden City (Beijing), Angkor Wat (Cambodia), Bagan (Myanmar), Borobudur (Indonesia), Mt Fuji + Kinkaku-ji (Japan), Halong Bay (Vietnam), Petra (Jordan), Burj Khalifa + Sheikh Zayed Mosque (UAE), Bali (Indonesia), Phuket / Bangkok (Thailand). Americas — Grand Canyon, Niagara Falls, Times Square / Statue of Liberty (NYC), Disneyland / Disney World, Yellowstone, Yosemite (US); Machu Picchu (Peru), Iguazu Falls (BR/AR), Christ the Redeemer / Sugarloaf (Rio), Galápagos (Ecuador), Tikal (Guatemala). Africa — Pyramids of Giza, Victoria Falls (Zambia / Zimbabwe), Serengeti / Maasai Mara (TZ / KE), Sahara, Marrakech medina, Cape Town / Table Mountain. Oceania — Sydney Opera House + Harbour Bridge, Great Barrier Reef, Uluru (Ayers Rock), Milford Sound (NZ). Indian — Taj Mahal, Kerala backwaters, Goa beaches, Rajasthan forts (Jaipur, Udaipur, Jodhpur, Jaisalmer), Varanasi ghats, Hampi, Ajanta-Ellora caves, Andaman & Nicobar."
    category: travel
  - text: "Travel / aviation accessories: TSA PreCheck (US), Global Entry (US, Indians eligible 2025), CLEAR, Nexus (US-CA), Mobile Passport, Aadhaar-based DigiYatra (India airports — biometric boarding). Lounge access — Priority Pass (1300+ lounges), Diners Club, Centurion (Amex), DragonPass, LoungeKey, Plaza Premium, Encalm (India), Lemon (India). Premium credit cards — Amex Platinum (US, India variants), Centurion (invite-only), Chase Sapphire Reserve (US), Capital One Venture X, HSBC Premier; India — Axis Magnus (recently devalued), HDFC Infinia / Diners Black, ICICI Emeralde Private Metal, IDFC First Wealth, AU LIT, Yes Marquee, Hilton, IHG, Marriott Bonvoy. Loyalty / status — Star Alliance Gold / Silver, Skyteam Elite Plus / Elite, Oneworld Emerald / Sapphire / Ruby. Miles transfers — Amex MR, Chase UR, Capital One miles, Citi ThankYou (US); Marriott / Hilton / Hyatt / IHG points; airline programs (Asia Miles CX, KrisFlyer SQ, AAdvantage AA, Mileage Plus UA, SkyMiles DL, Skywards EK)."
    category: travel
  - text: "Travel insurance / safety: trip cancellation, trip interruption, medical, evacuation, baggage delay / loss, flight delay, rental car CDW (collision damage waiver). Major providers — Allianz, AXA, World Nomads, SafetyWing (digital nomad), Cigna Global, Tata AIG, ICICI Lombard, HDFC Ergo, Bajaj Allianz, Reliance General (India). Travel apps for everything else — Google Maps (universal), Apple Maps, Waze (traffic), MAPS.ME (offline), HERE WeGo, OsmAnd; Translate — Google Translate, DeepL, Naver Papago (Asian), iTranslate; Currency — XE, Currency, Revolut, Wise. Phone — eSIM (Airalo, Holafly, Nomad, Maya Mobile, Ubigi), local SIM, roaming partner; portable WiFi (Skyroam — declining era). VPNs — NordVPN, ExpressVPN, Surfshark, Mullvad, Proton VPN."
