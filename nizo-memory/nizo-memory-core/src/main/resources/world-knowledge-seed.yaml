  - text: "Indian e-commerce / startups (large): Flipkart (Walmart majority), Myntra (Flipkart group), Amazon India, Meesho (social), Snapdeal, JioMart (Reliance), Tata Cliq, AJIO (Reliance), Nykaa (beauty), Tata 1mg, PharmEasy / API Holdings, Lenskart (eyewear), FirstCry (kids), boAt (audio, Imagine Marketing), Mamaearth / Honasa, Sugar Cosmetics, Wakefit (mattresses), UrbanCompany / Urban Clap (services), MakeMyTrip, Yatra, EaseMyTrip, ixigo, RedBus, IRCTC. Quick commerce — Blinkit (Zomato), Zepto, Swiggy Instamart, BigBasket BB Now, Tata Neu."
