  - text: "Capitals — selected: Africa — Algiers (DZ), Cairo (EG), Lagos commercial / Abuja capital (NG), Pretoria + Cape Town + Bloemfontein (ZA — 3 capitals), Nairobi (KE), Addis Ababa (ET), Accra (GH), Dakar (SN), Rabat (MA), Tunis (TN), Tripoli (LY), Khartoum (SD), Kampala (UG), Kigali (RW), Dar es Salaam commercial / Dodoma capital (TZ), Antananarivo (MG), Lusaka (ZM), Harare (ZW), Maputo (MZ), Luanda (AO), Kinshasa (DRC). Asia — New Delhi (IN), Beijing (CN), Tokyo (JP), Seoul (KR), Pyongyang (N. Korea), Bangkok (TH), Hanoi (VN), Manila (PH), Jakarta — moving to Nusantara (ID), Kuala Lumpur (MY), Singapore (SG), Naypyidaw (MM), Phnom Penh (KH), Vientiane (LA), Dhaka (BD), Islamabad (PK), Colombo + Sri Jayawardenepura Kotte (LK), Kathmandu (NP), Thimphu (BT), Male (MV), Ulaanbaatar (MN), Astana (KZ), Tashkent (UZ), Bishkek (KG), Dushanbe (TJ), Ashgabat (TM), Kabul (AF). Middle East — Riyadh (SA), Abu Dhabi (UAE), Doha (QA), Kuwait City (KW), Manama (BH), Muscat (OM), Sana'a (YE), Baghdad (IQ), Amman (JO), Beirut (LB), Damascus (SY), Jerusalem (contested) / Tel Aviv (IL), Ramallah (PS), Tehran (IR), Ankara (TR), Cairo (EG)."
