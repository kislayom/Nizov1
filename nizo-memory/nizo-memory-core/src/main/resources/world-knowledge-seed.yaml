  - text: "Indian conglomerates / large groups: Tata Group (Tata Consultancy Services / TCS, Tata Steel, Tata Motors / Jaguar Land Rover, Tata Power, Titan, Tanishq, Croma, Air India, Vistara, Voltas, Indian Hotels / Taj, Tata Salt, Tata Tea, BigBasket, 1mg, Cliq); Reliance Industries (RIL — Jio telecom, JioCinema, Reliance Retail, Tira, AJIO, Trends, petrochemicals, refining, Network18); Adani Group (ports, energy, airports, cement, media — NDTV); Aditya Birla (UltraTech Cement, Hindalco, Grasim, Vodafone Idea / Vi, Aditya Birla Capital, Pantaloons, Sun Life); Mahindra Group (Mahindra & Mahindra autos, Tech Mahindra, Mahindra Holidays, Mahindra Finance); Bajaj (Bajaj Auto, Bajaj Finance / Finserv, Allianz JV); Godrej; Hinduja; JSW; Jindal; ITC."
    category: companies
  - text: "Indian IT services 'big 5': Tata Consultancy Services (TCS), Infosys, Wipro, HCL Technologies, Tech Mahindra. Adjacent — Cognizant (US-listed, India-heavy), L&T Infotech (LTIMindtree), Persistent, Mphasis, Coforge (former NIIT Tech), Mindtree (now LTIMindtree), Hexaware, Mastek. Indian product / SaaS — Zoho (Sridhar Vembu), Freshworks (NASDAQ-listed), Postman, Druva, Razorpay, Cred, Slice, Khatabook, BharatPe, Pine Labs, Ola Electric, MapmyIndia."
    category: companies
  - text: "Major Indian banks: public — State Bank of India (SBI, largest), Bank of Baroda, Punjab National Bank (PNB), Canara Bank, Union Bank, Bank of India, IDBI Bank, Indian Bank. Private — HDFC Bank (largest private), ICICI Bank, Axis Bank, Kotak Mahindra Bank, IndusInd, Yes Bank, IDFC First Bank, Federal Bank, RBL, Bandhan, AU Small Finance. Foreign in India — Citi (sold consumer to Axis 2023), HSBC, Standard Chartered, DBS (acquired Lakshmi Vilas), Deutsche, Barclays. NBFCs — Bajaj Finance, Shriram Finance, L&T Finance, Cholamandalam, Muthoot Finance, Manappuram. Regulator — RBI (Reserve Bank of India)."
    category: companies
  - text: "Major US banks / financial: JPMorgan Chase (largest by assets), Bank of America (BofA), Citigroup, Wells Fargo, Goldman Sachs, Morgan Stanley, US Bancorp, PNC, Truist, Capital One. Asset managers — BlackRock (largest globally, ~$10T AUM), Vanguard (index-fund pioneer), State Street (SPDR ETFs), Fidelity, T. Rowe Price, Invesco. Brokers — Charles Schwab (acq. TD Ameritrade), Interactive Brokers, Robinhood, Fidelity, eToro, Webull. Investment banks (boutique) — Lazard, Evercore, Moelis, Centerview, Houlihan Lokey, Rothschild."
    category: companies
  - text: "Major UK / EU banks: HSBC, Barclays, Lloyds, NatWest, Standard Chartered (UK); BNP Paribas, Société Générale, Crédit Agricole, BPCE (France); Deutsche Bank, Commerzbank (Germany); ING, Rabobank, ABN AMRO (Netherlands); UBS (acq. Credit Suisse 2023), Julius Baer (Switzerland); Santander, BBVA (Spain); UniCredit, Intesa Sanpaolo (Italy); Nordea (Nordics); Erste, Raiffeisen (Austria/CEE)."
    category: companies
  - text: "Major Asian banks: Industrial and Commercial Bank of China (ICBC, largest globally by assets), China Construction Bank, Agricultural Bank of China, Bank of China, Bank of Communications, Ping An (insurance/banking), Alibaba's Ant Group (Alipay). Japan — Mitsubishi UFJ (MUFG), Sumitomo Mitsui (SMBC), Mizuho, Nomura. Singapore — DBS, OCBC, UOB. Hong Kong — Hang Seng (HSBC), Bank of East Asia. Korea — KB Financial, Shinhan, Hana, Woori. SE Asia — Bangkok Bank, Maybank (Malaysia), CIMB, Bank Mandiri (Indonesia). Middle East — Emirates NBD, ADCB, FAB (UAE); SNB, Al Rajhi (Saudi); QNB (Qatar)."
    category: companies
  - text: "Indian FMCG / consumer: Hindustan Unilever (HUL, Unilever subsidiary — Surf Excel, Lux, Lifebuoy, Dove, Kissan, Knorr, Brooke Bond, Bru, Magnum, Wheel), ITC (cigarettes + Aashirvaad atta, Bingo, Sunfeast, YiPPee, Fiama, Vivel, Engage, hotels), Nestlé India (Maggi, Nescafé, KitKat, Munch), Britannia (biscuits, dairy), Parle (Parle-G, Monaco, Hide & Seek), Dabur (Vatika, Hajmola, Real, Honitus), Marico (Parachute, Saffola, Livon), Godrej Consumer (Cinthol, Good Knight, HIT, Aer), Patanjali (Ramdev), Emami (Boroplus, Fair and Handsome, Navratna), Adani Wilmar (Fortune oil), Britannia, Amul (cooperative — milk, butter, ghee, ice cream, cheese), Mother Dairy."
