# =============================================================================
# nizo-memory — Default World Knowledge Seed
# -----------------------------------------------------------------------------
# Baseline knowledge an average educated adult carries: currencies, geography,
# health, finance, tech, food, transport, education, work, religion, sports,
# politics — across India, US, UK, EU, Middle East, East Asia, Southeast Asia,
# Australia, LATAM and Africa. Used as PROCEDURAL memory the extraction LLM
# leans on for disambiguation and grounding.
#
# Source: world_knowledge | confidence 0.95 | tier PROCEDURAL
# Re-seeds when CURRENT_SEED_VERSION in WorldKnowledgeSeed.java is bumped.
#
# Style rules for adding entries:
#   - One self-contained fact per entry. No filler.
#   - Compact lists are fine ("Major X: A, B, C, D") — avoid prose.
#   - Geographically aware: when a fact is region-specific, label it.
#   - Update categories thoughtfully — extraction-time retrieval filters by them.
# =============================================================================

heuristics:

  # ═══════════════════════════════════════════════════════════════════════════
  # extraction-guards — rules that prevent common LLM misclassifications
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Phrases like 'iPhone user', 'Android user', 'Pixel user', 'Samsung user' refer to phone preference, NOT a job/occupation. They go in PREFERENCE with subject='phone', not PROFILE.occupation."
    category: extraction-guards
  - text: "Phrases like 'Linux user', 'macOS user', 'Windows user', 'Vim user', 'Emacs user' refer to tool/OS preference, NOT a job. They go in PREFERENCE with subject='OS' or 'editor'."
    category: extraction-guards
  - text: "Lifestyle labels — 'morning person', 'night owl', 'foodie', 'introvert', 'extrovert', 'minimalist', 'optimist', 'pessimist' — are PREFERENCE with domain='lifestyle' or 'personal', NOT occupation."
    category: extraction-guards
  - text: "Diet labels — vegetarian, vegan, kosher, halal, jain, pescatarian, flexitarian, keto, paleo, gluten-free — are PREFERENCE with domain='lifestyle' or 'health', NOT a job."
    category: extraction-guards
  - text: "Religious / spiritual identity — 'I'm Hindu / Muslim / Christian / Buddhist / Sikh / Jain / Jewish / atheist / agnostic / spiritual but not religious' — is PREFERENCE with domain='religion', NOT a job."
    category: extraction-guards
  - text: "Linguistic identity — 'native Tamil speaker', 'Mandarin speaker', 'bilingual in English and Spanish' — is PROFILE.languages or PREFERENCE, NOT occupation."
    category: extraction-guards
  - text: "City of residence — 'I live in Bangalore', 'based in NYC', 'moved to Berlin' — is PROFILE.location, NOT a job. Co-occurring company name is the employer."
    category: extraction-guards
  - text: "Real job titles include: engineer, developer, manager, director, designer, scientist, doctor, lawyer, accountant, consultant, analyst, founder, executive, professor, teacher, writer, artist, nurse, surgeon, architect, marketer, salesperson, recruiter, trader, banker, investor, journalist, chef, pilot, electrician, plumber, mechanic."
    category: extraction-guards
  - text: "Commands like 'analyze X', 'search for Y', 'show me Z', 'remind me to W', 'find Q', 'summarize this' are NOT extractable life facts — return empty {} for command-only messages."
    category: extraction-guards
  - text: "Every assertion/context/summary field MUST be a complete, full phrase. Never bare verbs like 'prefer', 'use', 'specifically'. If the field can't be filled with a full phrase, omit it."
    category: extraction-guards
  - text: "DEFERRAL triggers: 'I'll think about it', 'let me get back to you', 'haven't decided', 'not sure yet', 'will wait', 'too expensive', 'will pass for now', 'maybe later', 'on the fence'."
    category: extraction-guards
  - text: "RESOLUTION triggers: 'I decided to', 'I'm going with', 'I chose', 'I switched to', 'I'll go ahead with', 'made up my mind', 'committed to'. When user resolves a previously deferred decision, emit RESOLUTION (NOT another DEFERRAL)."
    category: extraction-guards
  - text: "Deferral context MUST capture the BLOCKER (price too high, time constraint, uncertainty, waiting on someone). Without the blocker the agent can't know when to re-surface."
    category: extraction-guards
  - text: "Hypotheticals — 'if I were to...', 'imagine I...', 'in theory...', 'suppose...' — are NOT life facts. Skip unless the user is clearly committing."
    category: extraction-guards

