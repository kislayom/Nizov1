  # ═══════════════════════════════════════════════════════════════════════════
  # science — physics, chemistry, biology, earth, astronomy, computing
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Physics fundamentals: classical mechanics (Newton's 3 laws — inertia, F=ma, action-reaction), gravity (inverse-square), thermodynamics (4 laws — 0th, 1st conservation of energy, 2nd entropy increases, 3rd absolute zero). Electromagnetism — Maxwell's equations, electric / magnetic fields, light as EM wave. Modern physics — special relativity (1905, Einstein, E=mc², light speed constant ~300,000 km/s), general relativity (1915, gravity as spacetime curvature), quantum mechanics (Planck, Bohr, Heisenberg uncertainty, Schrödinger, wave-particle duality, superposition, entanglement). Standard Model — 17 fundamental particles (quarks, leptons, bosons — Higgs discovered 2012 LHC). Forces — gravity, electromagnetism, strong, weak (strong + weak unified at high energy). Scales — Planck → quark → atom → cell → human → planet → star → galaxy → universe (~93 Gly observable)."
    category: science
  - text: "Chemistry fundamentals: periodic table (118 elements as of 2026, rows = periods, columns = groups; H hydrogen = 1, He helium = 2, ..., Og oganesson = 118 heaviest synthesised). States — solid / liquid / gas / plasma + BEC / Fermi. Atoms = protons + neutrons (nucleus) + electrons (shells). Bonds — ionic (electron transfer, NaCl), covalent (sharing, H2O, CH4), metallic, hydrogen (weak). pH — 0-14 scale, <7 acid, 7 neutral, >7 base, log scale. Organic chemistry — carbon compounds, hydrocarbons, functional groups (alcohol, aldehyde, ketone, carboxylic acid, ester, amine). Biochemistry — proteins (amino acids, 20 standard), lipids, carbs, nucleic acids (DNA / RNA). Chemistry Nobel 2024 — Hassabis + Jumper (AlphaFold) + Baker (protein design)."
    category: science
  - text: "Biology fundamentals: cell theory (all life = cells, smallest unit). Prokaryotes (bacteria, archaea — no nucleus) vs eukaryotes (plants, animals, fungi, protists — nucleus + organelles). DNA double helix (Watson / Crick / Franklin 1953), genes → proteins (central dogma: DNA → RNA → protein). 46 human chromosomes (23 pairs), ~20,000 genes. Evolution by natural selection (Darwin, Origin of Species 1859). Taxonomy — domain > kingdom > phylum > class > order > family > genus > species (Linnaean binomial — Homo sapiens). Key systems — nervous, circulatory, respiratory, digestive, endocrine, immune, reproductive. Ecology — ecosystems, food chains / webs, biomes (rainforest, desert, tundra, savanna, taiga, ocean), biodiversity, keystone species, climate change impact. Notable breakthroughs — CRISPR-Cas9 gene editing (Doudna + Charpentier, Nobel 2020), Human Genome Project completed 2003, mRNA vaccines (COVID 2020)."
    category: science
  - text: "Earth / space basics: age of universe ~13.8B yrs (Big Bang), age of Earth ~4.5B yrs, life ~3.5B yrs, humans Homo sapiens ~300K yrs, recorded history ~5K yrs. Solar system — 8 planets: Mercury, Venus, Earth, Mars (inner / rocky), Jupiter, Saturn (gas giants), Uranus, Neptune (ice giants). Pluto reclassified dwarf planet 2006. Earth — 1 moon. Mars — 2 (Phobos, Deimos). Jupiter — 95+ moons (Io, Europa, Ganymede, Callisto = Galilean). Saturn — 140+ + rings (ice / rock). Nearest star system — Alpha Centauri (4.37 ly). Milky Way galaxy — ~100-400B stars, our sun is one. Andromeda nearest major galaxy (~2.5M ly), will collide with Milky Way ~4.5B yrs. Space agencies — NASA (US), ESA (EU), Roscosmos (RU), CNSA (CN), JAXA (JP), ISRO (India — Chandrayaan-3 Moon south pole 2023, Aditya-L1 sun), SpaceX (US private — Falcon, Dragon, Starship)."
    category: science
  - text: "Climate science: greenhouse gases — CO2 (primary, fossil fuels), CH4 methane (livestock, gas leaks — 80x CO2 warming over 20 yrs), N2O nitrous oxide (agriculture), fluorinated gases (refrigerants). Pre-industrial CO2 ~280 ppm → 2024 ~425 ppm. Paris Agreement (2015) — limit warming to 1.5°C (stretch) / 2°C (upper) above pre-industrial. IPCC = UN climate science body; assessment reports AR1 (1990) → AR6 (2021-23). Effects — sea-level rise, ocean acidification, Arctic / Antarctic ice loss, coral bleaching, extreme weather increase (heat, storms, droughts, floods, wildfires), biodiversity loss. Mitigation — renewables (solar, wind, hydro, geothermal, nuclear), EVs, efficiency, carbon capture, reforestation. Net zero, carbon neutral, carbon negative. Carbon credits / offsets markets (contested quality)."
    category: science
  - text: "Nobel Prizes: 6 categories — Physics, Chemistry, Physiology or Medicine, Literature, Peace, Economic Sciences (added 1969, Sveriges Riksbank). Announced Oct, awarded Dec 10 (Alfred Nobel's death). Notable recent — Nobel Physics 2024: Hopfield + Hinton (neural networks); Chemistry 2024: Baker / Hassabis / Jumper (proteins); Peace 2024: Nihon Hidankyo (Japanese A-bomb survivors). Indian Nobelists — Rabindranath Tagore (Literature 1913, first Asian), C.V. Raman (Physics 1930), Har Gobind Khorana (Medicine 1968, with US), Mother Teresa (Peace 1979), Subrahmanyan Chandrasekhar (Physics 1983), Amartya Sen (Economics 1998), Venkatraman Ramakrishnan (Chemistry 2009, with UK), Kailash Satyarthi (Peace 2014, with Malala Yousafzai PAK), Abhijit Banerjee (Economics 2019, with Duflo + Kremer). Fields Medal — math's top prize, every 4 yrs, under 40. Turing Award — computing. Abel Prize — math. Pulitzer — US journalism + arts."
    category: science
  - text: "Major historical scientific / technological discoveries: agriculture ~10K BCE (Neolithic), writing ~3200 BCE (Sumerian cuneiform), wheel ~3500 BCE, printing press (Gutenberg ~1440), steam engine (Watt 1776), electricity (Faraday, Edison, Tesla late 1800s), telephone (Bell 1876), automobile (Benz 1886), powered flight (Wright brothers 1903), radio (Marconi), penicillin (Fleming 1928), transistor (Bell Labs 1947), DNA structure (1953), integrated circuit (Kilby / Noyce 1958), laser (1960), ARPANET / internet precursor (1969), microprocessor (Intel 4004, 1971), personal computer (Altair, Apple I/II, IBM PC late 70s / early 80s), World Wide Web (Tim Berners-Lee 1989, public 1991), smartphone (iPhone 2007), GPT era (2018+), CRISPR (2012-14), mRNA COVID vaccines (2020-21)."
    category: science

  # ═══════════════════════════════════════════════════════════════════════════
  # math — basic concepts + statistics + finance math
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Math arithmetic / algebra basics: order of operations — PEMDAS / BODMAS (parentheses / brackets, exponents / orders, multiplication + division, addition + subtraction). Percentages — of = multiply, % change = (new − old) / old × 100. Fractions, decimals, ratios, proportions. Powers / exponents (aⁿ), roots (√, ∛), logarithms (log, ln — natural, base e ≈ 2.718). Scientific notation (1.5 × 10⁶ = 1,500,000). Equations — linear (y = mx + c), quadratic (ax² + bx + c = 0, quadratic formula), simultaneous, inequalities, polynomial, exponential, logarithmic. Sequences — arithmetic (constant difference), geometric (constant ratio), Fibonacci."
    category: math
  - text: "Statistics basics: mean (average = sum/n), median (middle value), mode (most frequent), range, variance, standard deviation (σ — spread around mean). Distributions — normal (bell curve, 68/95/99.7 rule at 1/2/3σ), uniform, Poisson (counts), binomial, exponential, power law (long tail). Probability — 0 to 1, independence, conditional P(A|B), Bayes' theorem (P(A|B) = P(B|A)P(A) / P(B)). Correlation ≠ causation. Confidence interval, p-value (<0.05 conventionally 'significant' but contested), Type I / II errors. Sampling — random, stratified, cluster. A/B testing, statistical power."
    category: math
  - text: "Financial math: simple interest = P × r × t; compound interest = P × (1 + r/n)^(n·t) where n = compounding freq per period; 'power of compounding' underpins retirement math. Rule of 72 — doubling time ≈ 72 / annual % return (so 8% → ~9 yrs, 12% → 6 yrs, 6% → 12 yrs). Present value / NPV (discount future cash flows), IRR (internal rate of return — makes NPV zero), CAGR (compound annual growth rate). XIRR for irregular cash flows (Indian MF community loves this). EMI formula: P × r × (1+r)ⁿ / ((1+r)ⁿ − 1). Inflation — if CPI = 6%, ₹100 today = ₹94 next year in purchasing power. Real return = nominal − inflation."
    category: math
  - text: "Probability / decision concepts (common in business / life): expected value = Σ (outcome × prob), Kelly criterion (optimal bet sizing), base rate (prior probability), regression to the mean, survivorship bias, selection bias, confirmation bias, recency bias, sunk cost fallacy, opportunity cost, marginal utility / diminishing returns, Pareto principle / 80-20, Moore's Law (compute doubling every ~2 yrs — slowing). Game theory — zero-sum, positive-sum, prisoner's dilemma, Nash equilibrium, tit-for-tat, chicken. Markets — supply / demand, price elasticity, inflation / deflation, recession (2 qtrs negative GDP), depression, stagflation (high inflation + high unemployment)."
    category: math

  # ═══════════════════════════════════════════════════════════════════════════
  # history — major eras, events, wars
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Major historical eras (Western-centric lens): Ancient — Sumer / Mesopotamia (~3500 BCE, writing, wheel), Ancient Egypt (pyramids, pharaohs, ~3100 BCE unified), Indus Valley / Harappa (~2500-1900 BCE, South Asia urban), Ancient China (Shang, Zhou, Qin — First Emperor 221 BCE unifies + Great Wall, Han), Classical Greece (~500-300 BCE — Athens democracy, Plato / Aristotle / Socrates), Alexander the Great (356-323 BCE). Roman Republic → Empire (~500 BCE - 476 CE west, 1453 east). Medieval (~500-1500) — Dark Ages, Byzantine, Islamic Golden Age (Baghdad, Córdoba), Viking Age, Crusades, Black Death (1346-53 kills ~1/3 Europe), Mongol Empire (Genghis / Kublai Khan — largest contiguous empire ever). Renaissance (14th-17th c, Italy), Age of Exploration (Columbus 1492, Vasco da Gama India 1498, Magellan circumnavigation 1519-22), Reformation (Luther 1517), Scientific Revolution (Copernicus / Kepler / Galileo / Newton), Enlightenment (17th-18th c)."
    category: history
  - text: "Modern era highlights: Industrial Revolution (1760s-1840s UK, then Europe / US — steam, railways, factories). American Revolution (1776, Declaration of Independence Jul 4). French Revolution (1789, 'Liberté, égalité, fraternité'), Napoleon (1799-1815). Abolition of slavery (UK 1833, US 1865 post-Civil War). Scramble for Africa / Colonialism peak (late 1800s). Meiji Restoration Japan (1868). World War I (1914-18, 'the Great War', triggered by Franz Ferdinand assassination Sarajevo). Russian Revolution (1917, Bolsheviks, Lenin). Spanish Flu pandemic (1918-20, ~50M dead). Great Depression (1929-). World War II (1939-45, Holocaust 6M Jews murdered, atomic bombings Hiroshima / Nagasaki 1945, ended Pacific War). UN founded 1945. Partition of India + Pakistan 1947 (Aug 14 PK, Aug 15 IN). Israeli independence 1948. Chinese Revolution — PRC 1949 (Mao). Korean War (1950-53)."
    category: history
  - text: "Post-1945 history: Cold War (1947-91, US vs USSR, Iron Curtain, Berlin Wall 1961-89, Cuban Missile Crisis 1962, proxy wars — Vietnam 1955-75, Afghanistan 1979-89). Space race — Sputnik 1957, Moon landing 1969 (Apollo 11 Armstrong / Aldrin). Decolonisation waves (1940s-70s, most of Africa / Asia). Civil Rights Movement US (1950s-60s, MLK, Rosa Parks, Voting Rights 1965). Apartheid S. Africa (1948-94, Mandela released 1990, president 1994). Iranian Revolution 1979. Fall of Berlin Wall 1989, USSR dissolves 1991. Rwandan genocide 1994 (Hutu vs Tutsi, ~800K killed). EU formation (Maastricht 1992, Euro 1999/2002). Hong Kong handover UK → China 1997. 9/11 attacks 2001, War on Terror, Afghanistan + Iraq wars (2001+, 2003-11). 2008 Global Financial Crisis (Lehman collapse). Arab Spring 2010-12. Brexit referendum 2016, UK leaves EU 2020. COVID-19 pandemic 2020-23. Russia invades Ukraine Feb 2022. Oct 7 2023 Israel-Hamas war. Generative AI mass adoption 2022+ (ChatGPT Nov 2022)."
    category: history
  - text: "Indian history timeline: Indus Valley (~2500 BCE, Harappa / Mohenjo-daro), Vedic period (~1500-500 BCE, Rigveda), Mauryan Empire (Chandragupta 322 BCE, Ashoka ~268-232 — edicts, Buddhism spread), Gupta 'Golden Age' (~320-550 CE, math / astronomy — Aryabhata / Brahmagupta, zero), Chola Empire (S India, ~850-1250, temple architecture, SEA influence), Delhi Sultanate (1206-1526), Vijayanagara (1336-1646, S India counter), Mughals (Babur 1526 → Akbar → Shah Jahan Taj Mahal 1632-53 → Aurangzeb → decline). Maratha Empire (Shivaji 17th c, expansion to defeat-Panipat 1761). European trading companies — Portuguese 1498 (Goa), Dutch, British (EIC 1600), French. Battle of Plassey 1757 → British rule. 1857 Sepoy Mutiny / First War of Independence. British Raj 1858-1947. Gandhi's satyagraha (Salt March 1930, Quit India 1942). Independence Aug 15 1947 + Partition (~1M killed, 15M displaced). Constitution Jan 26 1950. Green Revolution 1960s (self-sufficiency in grain). 1991 economic liberalisation (Manmohan Singh finance minister). Nuclear tests 1974, 1998."
    category: history
  - text: "Major 20th-21st c. wars / conflicts: WWI (1914-18, ~20M dead), WWII (1939-45, ~70-85M dead, Holocaust, atomic weapons), Korean War (1950-53), Vietnam War (1955-75, US involvement 1964-73), Indo-Pak wars (1947-48 Kashmir, 1965, 1971 → Bangladesh independence, 1999 Kargil), Arab-Israeli wars (1948, 1967 Six-Day, 1973 Yom Kippur), Gulf War (1990-91, Iraq invaded Kuwait), Yugoslav Wars (1991-2001, Bosnian genocide Srebrenica 1995), Rwandan Genocide 1994, Afghanistan (2001-21 US + allies, Taliban returned), Iraq War (2003-11), Syrian Civil War (2011-, ongoing), Yemen (2014-, humanitarian crisis), Russia-Ukraine (Crimea 2014, full invasion Feb 2022), Israel-Hamas (Oct 7 2023-). Genocides recognised — Armenian (1915, Ottoman), Holocaust (1941-45), Cambodian / Khmer Rouge (1975-79 Pol Pot, ~1.7M), Rwandan (1994), Bosnian (1995), Darfur (2003-), Uyghur (ongoing debate)."
    category: history

