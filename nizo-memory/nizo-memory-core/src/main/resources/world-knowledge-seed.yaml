  - text: "Capitals (Europe + Americas + Oceania): Europe — London (UK), Paris (FR), Berlin (DE), Rome (IT), Madrid (ES), Amsterdam (NL), Brussels (BE), Vienna (AT), Bern (CH), Lisbon (PT), Dublin (IE), Athens (GR), Warsaw (PL), Prague (CZ), Budapest (HU), Bucharest (RO), Sofia (BG), Belgrade (RS), Zagreb (HR), Ljubljana (SI), Sarajevo (BA), Skopje (MK), Tirana (AL), Podgorica (ME), Pristina (XK), Stockholm (SE), Oslo (NO), Copenhagen (DK), Helsinki (FI), Reykjavik (IS), Tallinn (EE), Riga (LV), Vilnius (LT), Minsk (BY), Kyiv (UA), Chisinau (MD), Moscow (RU), Vatican City (VA), Valletta (MT), Nicosia (CY), Luxembourg (LU), Monaco. Americas — Washington DC (US), Ottawa (CA), Mexico City (MX), Brasília (BR), Buenos Aires (AR), Santiago (CL), Lima (PE), Bogotá (CO), Caracas (VE), Quito (EC), La Paz + Sucre (BO), Asunción (PY), Montevideo (UY), Guatemala City (GT), San José (CR), Panama City (PA), Havana (CU), Santo Domingo (DR), Port-au-Prince (HT), Kingston (JM), Bridgetown (BB), Port of Spain (TT), Nassau (BS). Oceania — Canberra (AU), Wellington (NZ), Suva (FJ), Port Moresby (PG), Honiara (SB), Apia (WS), Nuku'alofa (TO), Funafuti (TV), Tarawa (KI), Yaren / no official (NR), Palikir (FM), Majuro (MH), Ngerulmud (PW)."
    category: geography
  - text: "Climate zones (Köppen simplified): tropical (rainforest Af / monsoon Am / savanna Aw — equator ±15-25°), arid (desert BWh hot / BWk cold; semi-arid BS), temperate (Mediterranean Cs — dry summers; humid subtropical Cfa — Florida, north India plains, eastern China; oceanic Cfb — UK, NW Europe), continental (Dfa / Dfb / Dfc — cold winters, warm summers — Russia, Canada, US Midwest), polar (tundra ET, ice cap EF — Antarctica, Greenland, Arctic). Indian climate — tropical wet (W coast, NE), tropical dry, subtropical humid (N plains), arid (Rajasthan), alpine (Himalayas). Monsoon — SW (Jun-Sep, main rainy season most of India), NE (Oct-Dec, mainly Tamil Nadu / SE coast). Western Disturbances bring winter rain to N India / Pakistan."
    category: geography
  - text: "Major mountain ranges, rivers, deserts, oceans: mountains — Himalayas (Asia, Mt Everest 8,849m highest), Andes (S America, longest, Aconcagua), Rockies (N America), Alps (Europe, Mont Blanc), Atlas (N Africa), Urals (Europe-Asia divide), Caucasus, Karakoram (K2 = 2nd highest, Godwin-Austen), Hindu Kush, Kunlun, Tian Shan, Drakensberg (S Africa), Great Dividing Range (AU), Sierra Nevada (US/ES). Rivers (longest) — Nile (Africa, ~6,650 km — disputed with Amazon), Amazon (S America, by volume largest), Yangtze / Chang Jiang (China, 3rd), Mississippi-Missouri (US, 4th), Yenisei + Ob + Lena (Russia / Siberia), Yellow / Huang He (China cradle), Ganga / Ganges + Brahmaputra + Indus (S Asia), Mekong (SEA), Volga (Europe largest), Danube (10 EU countries), Rhine, Rhône, Thames, Seine. Deserts — Sahara (Africa, largest hot), Arabian, Gobi (Mongolia/China), Patagonian, Atacama (Chile, driest), Great Victoria (AU), Mojave / Sonoran / Chihuahuan (N. America), Thar (India / Pakistan), Karakum + Kyzylkum (Central Asia), Antarctic (largest cold desert). Oceans (5) — Pacific (largest, deepest at Mariana Trench ~11km), Atlantic, Indian, Arctic, Southern / Antarctic."
    category: geography

  # ═══════════════════════════════════════════════════════════════════════════
  # literature — books / authors deeper, beyond what's in famous-people
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Major literary genres: fiction — literary, commercial, sci-fi (hard SF, soft SF, space opera, cyberpunk, dystopian, post-apocalyptic), fantasy (high / epic, urban, grimdark, magical realism), mystery / thriller / crime / police procedural / cosy mystery, romance (contemporary, historical, romantasy), historical, horror, YA (young adult), MG (middle grade), children's picture books, graphic novel / manga / comic, classic, satire, magical realism (LATAM heritage). Non-fiction — biography / memoir, autobiography, history, popular science, philosophy, self-help, personal finance, business / management, true crime, travel writing, food writing, journalism, essays, religion / spirituality, poetry, drama / plays, reference."
    category: literature
  - text: "Iconic books / series often referenced: The Lord of the Rings + Hobbit (Tolkien), Harry Potter (Rowling, 7 books), Game of Thrones / A Song of Ice and Fire (Martin), 1984 + Animal Farm (Orwell), Brave New World (Huxley), Fahrenheit 451 (Bradbury), Dune (Herbert), Foundation + I, Robot (Asimov), Hitchhiker's Guide (Adams), Discworld (Pratchett), Sherlock Holmes (Doyle), To Kill a Mockingbird (Lee), The Great Gatsby (Fitzgerald), Catcher in the Rye (Salinger), 100 Years of Solitude + Love in the Time of Cholera (García Márquez), Crime and Punishment + Brothers Karamazov (Dostoyevsky), War and Peace + Anna Karenina (Tolstoy), Madame Bovary (Flaubert), Don Quixote (Cervantes), Pride and Prejudice (Austen), Wuthering Heights (Brontë), Moby-Dick (Melville), Ulysses (Joyce), In Search of Lost Time (Proust), The Stranger + The Plague (Camus), Norwegian Wood + Kafka on the Shore (Murakami), Things Fall Apart (Achebe). Indian — Midnight's Children + Satanic Verses (Rushdie), God of Small Things (Roy), A Suitable Boy (Seth), The White Tiger (Adiga), Train to Pakistan (Khushwant Singh), Malgudi Days (Narayan), Five Point Someone / 2 States (Bhagat), Discovery of India (Nehru), Wings of Fire (APJ Kalam autobiography), Shiva Trilogy (Amish), Mahabharata + Ramayana (epics), Bhagavad Gita."
    category: literature
  - text: "Influential non-fiction / business / self-help: Sapiens + Homo Deus + 21 Lessons (Harari), Thinking Fast and Slow (Kahneman), Black Swan + Antifragile + Skin in the Game (Taleb), Outliers + Tipping Point + Blink (Gladwell), Atomic Habits (Clear), 7 Habits of Highly Effective People (Covey), How to Win Friends and Influence People (Carnegie 1936), Influence (Cialdini), Power of Now (Tolle), Mindset (Dweck), Grit (Duckworth), Drive (Pink), Start with Why (Sinek), Good to Great + Built to Last (Collins), The Lean Startup (Ries), Zero to One (Thiel), Innovator's Dilemma (Christensen), Hard Thing About Hard Things (Horowitz), Steve Jobs (Isaacson — also Einstein, da Vinci, Musk, Hassabis), Shoe Dog (Knight, Nike memoir), When Genius Failed (Lowenstein, LTCM), Liar's Poker + Big Short + Moneyball (Lewis), Predictably Irrational (Ariely), Deep Work + So Good They Can't Ignore You (Newport), Tools of Titans (Ferriss), Show Your Work + Steal Like an Artist (Kleon), Bhagavad Gita / Tao Te Ching / Meditations (Marcus Aurelius — Stoicism)."
    category: literature

  # ═══════════════════════════════════════════════════════════════════════════
  # certifications — common professional credentials
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Tech / IT certifications: AWS — Cloud Practitioner, Solutions Architect (Associate / Pro), Developer, SysOps, Specialty (DevOps, Security, ML, Database, Networking, Data Engineer). Azure — Fundamentals AZ-900, Administrator AZ-104, Solutions Architect AZ-305, DevOps AZ-400, Data / ML / Security paths. GCP — Cloud Digital Leader, Associate Cloud Engineer, Professional Cloud Architect, Data Engineer, ML Engineer. Kubernetes — CKA (Administrator), CKAD (Application Developer), CKS (Security). Networking — Cisco CCNA / CCNP / CCIE. Linux — RHCSA / RHCE (Red Hat), LFCS / LPIC. Security — CISSP (architects), CISM, CISA, CompTIA Security+, CEH (ethical hacking), OSCP (offensive), CCSP (cloud security), GCIA / GCIH / GCFA (SANS GIAC). DevOps / SRE — HashiCorp (Terraform, Vault), Docker. Data — Databricks Certified, Snowflake SnowPro, Tableau, Power BI."
    category: certifications
  - text: "Finance / accounting / project mgmt certifications: CFA (Chartered Financial Analyst, 3 levels, ~3 yrs typical, global gold standard for investment), CPA (US, accounting), ACCA (UK, accounting), CIMA (UK mgmt accounting), CA (India / UK / AU / NZ — Chartered Accountant, ICAI in India), CMA (cost / mgmt accounting — IMA US, ICAI India), FRM (Financial Risk Manager — GARP), CAIA (alternative investments), CFP (Certified Financial Planner — for personal advisors). Project mgmt — PMP (PMI, ~6 hr exam), CAPM (entry), PgMP (program), PfMP (portfolio), PRINCE2 (UK / global), PMI-ACP (agile). Agile / Scrum — CSM (Certified ScrumMaster, Scrum Alliance), PSM I/II/III (Scrum.org), SAFe (Scaled Agile — SA, SP, RTE), CSPO. Quality — Six Sigma Yellow / Green / Black / Master Black Belt, ITIL (4 levels), CSQE."
    category: certifications

  # ═══════════════════════════════════════════════════════════════════════════
  # life-events — major milestones common across cultures
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Life-stage milestones (rough): birth, naming ceremony (Hindu naamkaran, Jewish bris / brit milah, Christian baptism / christening, Muslim aqiqah), first words / steps, weaning, starting school (~age 3-5), school transitions, puberty (~10-14), graduation (high school ~18, college ~21-22), first job, first apartment, financial independence, first car, marriage / partnership (varies by culture — average rising globally, ~28-32 in many countries), first home purchase, first child, child milestones (parenting cycle), promotion, career change, sabbatical, divorce / separation (where relevant), second / blended family, empty nest (~50s), grandparenting, retirement (~60-67 most countries), bereavement / widowhood, end-of-life planning (will, healthcare directive). Common rites of passage — Bar/Bat Mitzvah (Jewish, 12-13), Quinceañera (15, Latina), Sweet 16 (US), Coming of Age Day (Japan, 20 — recently 18), debutante balls (cotillion), thread ceremony / Upanayana (Hindu boys), Bar/Bat Mitzvah, baptism."
    category: life-events
  - text: "Major adult financial / legal milestones: opening a bank account, first credit card, building credit history, first salary tax filing, marriage (joint accounts, beneficiary updates), buying first home (mortgage, EMI, down payment ~10-25% typical), first investment (FD, MF, stocks), starting retirement contributions (401k / EPF / NPS / Super / RRSP / SIPP — earlier the better), getting health + life + critical-illness insurance, having children (529, Sukanya Samriddhi, JISA, RESP), wills + estate planning, power of attorney, healthcare directive / living will, organ donor, beneficiary designations, joint vs separate finances in marriage, financial independence + early retirement (FIRE movement: lean / barista / fat FIRE)."
    category: life-events
  - text: "Major work-life events: first job offer, signing bonus, RSUs / options grant, vesting cliff (typically 1 yr), promotion, lateral move, internal transfer / IJP, performance review (calibration, 360-feedback, stack ranking — increasingly out of favour), PIP (performance improvement plan, often precursor to firing), layoff / redundancy / RIF, severance, garden leave, non-compete, exit interview, sabbatical, parental leave (maternity 6mo+ India / 12-52 wk varies; paternity rising), career break (often women returning), career switch / pivot, going independent / freelance / consultant, founding a startup, fundraising rounds, pre-seed / seed / Series A / B / C / D, IPO, acquisition / acqui-hire, getting acquired (tag-along, drag-along, golden handcuffs)."
    category: life-events

  # ═══════════════════════════════════════════════════════════════════════════
  # units — common units of measurement, conversions
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Length / distance: metric — mm < cm (1 cm = 10 mm) < m (1 m = 100 cm) < km (1 km = 1000 m). Imperial — inch (1 in = 2.54 cm), foot (1 ft = 12 in ≈ 30.48 cm), yard (1 yd = 3 ft = 0.9144 m), mile (1 mi = 1.609 km). Maritime / aviation — nautical mile (1 nm = 1.852 km). Astronomy — light-year (~9.46 trillion km), parsec (~3.26 ly), AU (Earth-Sun = 149.6M km). Common conversions to memorise: 1 inch ≈ 2.5 cm; 1 foot ≈ 30 cm; 1 m ≈ 3.28 ft; 5 km ≈ 3.1 mi; 100 km ≈ 62 mi."
    category: units
  - text: "Weight, volume, temperature: weight — gram (g) < kilogram (kg = 1000g) < tonne (1000 kg = metric ton). Imperial — ounce (1 oz ≈ 28.35 g), pound (1 lb = 16 oz ≈ 453.6 g), stone (1 st = 14 lb, UK body weight). 1 kg ≈ 2.2 lb. Volume — millilitre (mL) < litre (L = 1000 mL). US — fl oz, cup, pint (16 oz), quart (32 oz), gallon (128 oz US ≈ 3.785 L) — UK gallon ≈ 4.546 L (different!). Temperature — Celsius / centigrade (water 0 freeze, 100 boil at sea level), Fahrenheit (32 freeze, 212 boil), Kelvin (0 K = -273.15 °C absolute zero). Conversion: F = C × 9/5 + 32; C = (F − 32) × 5/9. Body normal ~37 °C / ~98.6 °F."
    category: units
  - text: "Speed, area, energy, pressure, data: speed — km/h, mph, m/s (1 m/s = 3.6 km/h ≈ 2.24 mph), knots (1 kt = 1.852 km/h, used aviation / maritime). 100 km/h ≈ 62 mph. Area — sq m (m²), hectare (1 ha = 10,000 m²), acre (1 acre ≈ 4047 m² ≈ 0.4 ha), sq ft (1 m² ≈ 10.76 sq ft). India — bigha / katha vary by state. Energy — Joule (J), kilocalorie (kcal = food calorie ≈ 4.184 kJ), kilowatt-hour (kWh — billing unit). Power — watt (W), kW, hp (1 hp ≈ 745.7 W). Pressure — Pascal (Pa), bar (1 bar = 100,000 Pa ≈ atm), psi (tyre pressure 30-35 typical), mmHg (BP). Data — bit (b), byte (B = 8 bits), KB / MB / GB / TB / PB / EB (1024-based binary OR 1000-based SI — context-dependent, modern OSes vary). Bandwidth — Mbps, Gbps."
    category: units

  # ═══════════════════════════════════════════════════════════════════════════
  # climate-change — concepts users encounter daily in news / decisions
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Climate-change everyday vocabulary: net zero (emissions = removals), carbon neutral, carbon negative, scope 1 / 2 / 3 emissions (direct / energy purchased / value chain), carbon footprint, offsets vs reductions (offsets contested), CBAM (EU Carbon Border Adjustment Mechanism, phasing in), ESG investing, green bonds, sustainability-linked loans, just transition. Renewable energy share — Iceland / Norway / Bhutan / Costa Rica largely renewable; India aiming 500 GW non-fossil by 2030; China largest installer of solar + wind in absolute terms but coal-heavy too. EVs — Tesla, BYD, NIO, Hyundai Ioniq, Kia EV6, Volvo, Polestar, Mercedes EQ, BMW i, Audi e-tron, Rivian, Lucid, Fisker (defunct); Indian — Tata Nexon EV / Punch EV, Mahindra XUV400 / BE 6 / XEV 9e, Ola Electric S1 (scooter), Ather, BluSmart taxis. Solar / battery — LFP vs NMC chemistry, BESS (battery energy storage system), VPP (virtual power plant), grid-tied vs off-grid, wheeling charges, net metering."
    category: climate
  - text: "Sustainability + lifestyle terms: zero waste, plastic-free, circular economy, upcycling vs recycling, refurbished / certified pre-owned (CPO), fast fashion vs slow fashion, deadstock, secondhand / thrifting (Depop, Vinted, Poshmark, Cashify, Vestiaire Collective, The RealReal), repair right (right-to-repair laws), greenwashing (false eco claims). Diets with climate angle — flexitarian, plant-based, lab-grown meat (Upside Foods, Eat Just, Future Meat — limited availability), Beyond Meat / Impossible Foods (plant-based burger). Travel — flight shaming (flygskam, Sweden-origin), carbon offsets per flight (UA Eco-Skies, BA), train over plane (in EU especially), slow travel."
    category: climate

  # ═══════════════════════════════════════════════════════════════════════════
  # internet-culture — memes, eras, online subcultures, scams
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Internet eras / phases: Web 1.0 (~1991-2004, static pages, AOL, Yahoo, GeoCities, Napster, Friendster, MSN Messenger, ICQ, IRC); Web 2.0 (2004+, user-generated content, social media, mobile — Wikipedia, MySpace, YouTube 2005, Facebook public 2006, Twitter 2006, iPhone 2007, Instagram 2010, WhatsApp); mobile-first / app era (2010s); Web3 / blockchain hype (2017+, peaked 2021 NFT / DeFi crypto winter 2022); AI / generative era (2022+ — ChatGPT public Nov 30 2022 inflection point). Concurrent — meme culture (Know Your Meme, 4chan / Reddit / Tumblr ecosystems), creator economy (YouTubers, streamers, TikTokers, Substack writers), Discord / community-led, podcasting boom (2014+ Serial), short-form video (Vine 2013-17 → TikTok / Reels / Shorts), generative AI tools (Midjourney, DALL-E, Stable Diffusion, Sora video, ElevenLabs voice)."
    category: internet-culture
  - text: "Major online scams + safety hygiene: phishing (fake email / SMS / WhatsApp), smishing (SMS), vishing (voice / call), spear phishing (targeted), business email compromise (BEC), CEO fraud, romance scams, pig-butchering scams (slow trust → crypto loss), investment / crypto scams (rug pull, exit scam, pump-and-dump), Ponzi / pyramid (BitConnect, OneCoin), gift-card scams, tech-support scams, IRS / income-tax / Aadhaar / KYC update scams, courier-package scams ('your package has tax due'), 'job offer' fee scams, fake invoice scams, deepfake voice cloning of family members. Hygiene — never share OTP / CVV / PIN, enable 2FA (TOTP — Google Authenticator / Authy / 1Password / Apple Passwords; hardware keys YubiKey / Titan), use a password manager (1Password, Bitwarden, Apple Passwords, Dashlane), unique strong passwords per site, freeze credit (US/UK/India CIBIL), check links before clicking (hover / preview), never install screen-sharing apps for unknown 'support' (AnyDesk / TeamViewer common abuse vectors), use device biometrics, keep OS / apps updated."
    category: internet-culture
  - text: "AI literacy basics for users: LLMs hallucinate (confidently make up facts) — verify sources for anything important. Context window limit (each model has finite memory per session — old turns get pushed out). System / developer prompt vs user prompt vs assistant message vs tool result — different trust levels. RAG (retrieval-augmented generation) injects fresh / private documents into prompt at runtime. Fine-tuning vs base prompting vs few-shot examples. Agent = LLM + tool use loop + memory. Multimodal — text + image + audio + video input / output. Safety — prompt injection attacks (instructions hidden in untrusted content), jailbreaks (try to bypass guardrails), data exfiltration via tool calls. Cost / latency model — bigger / smarter models (frontier flagship) cost more and run slower than small / fast / cheap models. Open weights (Llama, Qwen, DeepSeek, Mistral) vs closed (GPT, Claude, Gemini). Local inference — Ollama, LM Studio, llama.cpp, vLLM."
    category: internet-culture
  - text: "Common privacy + identity terms: PII (personally identifiable information — name, address, DOB, gov ID, biometric), PHI (protected health info, US HIPAA), GDPR (EU, 2018 — right to access / rectify / erase / portability / object), CCPA / CPRA (California), DPDPA (India Digital Personal Data Protection Act 2023), LGPD (Brazil), POPIA (S Africa), Lei Geral (Mexico). Concepts — consent (opt-in / opt-out), data minimisation, purpose limitation, data subject access request (DSAR), right to be forgotten, data breach notification (typically 72 hr under GDPR), data processing agreement (DPA / Article 28), data controller vs processor, sub-processor, cross-border transfer (SCCs, adequacy decisions, Indian DPDP cross-border rules pending). Cookies — first-party, third-party (deprecating in browsers), session vs persistent, consent banners (EU rule). Tracking — fingerprinting, cross-site, ad-tech, do-not-track (DNT — largely ignored), iOS ATT (App Tracking Transparency, 2021 hit Meta ads). VPN, Tor, end-to-end encryption (E2E — WhatsApp, Signal, iMessage default; not Telegram default chats)."
    category: internet-culture
