  - text: "Global FMCG giants: Procter & Gamble (P&G — Tide, Pampers, Pantene, Olay, Gillette, Oral-B, Vicks, Whisper / Always); Unilever (Dove, Hellmann's, Knorr, Magnum, Lipton, Ben & Jerry's, Axe / Lynx); Nestlé (Nescafé, Maggi, KitKat, Nespresso, Gerber, Purina); Colgate-Palmolive; Kimberly-Clark (Huggies, Kleenex); Reckitt (Dettol, Lysol, Strepsils, Veet, Durex); Kellogg's; General Mills; Mondelez (Cadbury, Oreo, Toblerone); Mars (Snickers, M&M's, Pedigree); PepsiCo (Pepsi, Lay's, Doritos, Tropicana, Quaker, Gatorade); Coca-Cola (Coke, Sprite, Fanta, Minute Maid, Costa Coffee); L'Oréal; Estée Lauder; Shiseido (JP); LVMH (luxury — see fashion)."
    category: companies
  - text: "Indian pharma majors: Sun Pharmaceutical (largest Indian), Dr. Reddy's Laboratories, Cipla, Lupin, Aurobindo, Torrent Pharma, Glenmark, Cadila / Zydus, Biocon (insulins, biosimilars), Divis Labs (APIs), Alkem, Mankind, Abbott India, Pfizer India, GSK India, Sanofi India. Hospitals — Apollo Hospitals, Fortis Healthcare, Max Healthcare, Manipal Hospitals, Narayana Health, Medanta, AIIMS (govt, multiple), Tata Memorial. Diagnostics — Dr. Lal PathLabs, Metropolis, Thyrocare, SRL Diagnostics."
    category: companies
  - text: "Global pharma majors: Johnson & Johnson (J&J), Pfizer, Roche (CH), Novartis (CH), Merck (MSD outside US/Canada), AbbVie, Eli Lilly (Mounjaro, Zepbound — GLP-1), Novo Nordisk (DK — Ozempic, Wegovy GLP-1), AstraZeneca, GSK (GlaxoSmithKline), Sanofi (FR), Bristol Myers Squibb (BMS), Bayer, Boehringer Ingelheim, Takeda (JP), Moderna (mRNA), BioNTech (DE), Regeneron, Gilead, Amgen, Vertex. Indian generic exporters supply ~40% of US generics."
    category: companies
  - text: "Indian telecoms: Reliance Jio (largest by subs since 2017, 4G/5G), Bharti Airtel (group co. — Airtel India, Africa), Vodafone Idea (Vi, struggling), BSNL / MTNL (state, declining). Internet — JioFiber, Airtel Xstream, ACT, Hathway, Tata Play Fiber. Cable TV / DTH — Tata Play (former Tata Sky), Dish TV, Airtel Digital TV, Sun Direct, d2h."
    category: companies
  - text: "Global telecoms: US — Verizon, AT&T, T-Mobile US (Deutsche Telekom subsidiary), Comcast / Xfinity, Charter / Spectrum. UK — BT (EE), Vodafone, O2 (Telefónica → Virgin Media O2), Three. Germany — Deutsche Telekom, Vodafone DE, Telefónica DE / O2. France — Orange, SFR (Altice), Bouygues, Free / Iliad. China — China Mobile, China Unicom, China Telecom (state). Japan — NTT Docomo, KDDI / au, SoftBank, Rakuten Mobile. Korea — SK Telecom, KT, LG U+. Singapore — Singtel, StarHub, M1. UAE — du, Etisalat / e&. Saudi — STC. Australia — Telstra, Optus (Singtel), TPG / Vodafone AU."
    category: companies
  - text: "Major media / entertainment groups: US — Disney (Marvel, Lucasfilm / Star Wars, Pixar, ABC, ESPN, Hulu, Disney+), Warner Bros. Discovery (HBO, CNN, DC, Cartoon Network, TNT), Comcast / NBCUniversal (NBC, Universal Pictures, Peacock), Paramount Global (CBS, MTV, Paramount Pictures, Nickelodeon), Sony Pictures, Lionsgate, A24 (indie). India — Star India / Disney India / JioStar (post Disney-Reliance merger 2024), Zee Entertainment, Sony Pictures Networks India / Culver Max (Sony Liv, SET, Sony Sports), Network18 / Reliance, Sun Network (south), Eros, Yash Raj Films (YRF), Dharma Productions, Excel Entertainment. UK — BBC, ITV, Channel 4, Sky (Comcast). FR — Vivendi, Canal+. JP — Toei, Toho, Studio Ghibli, Bandai Namco. KR — CJ ENM (Parasite), Hybe (BTS, K-pop)."
