  - text: "Other major sports leagues: American football — NFL (Sep-Feb, Super Bowl in Feb). Basketball — NBA (Oct-Jun, US/CA). Baseball — MLB (Apr-Oct, World Series). Ice hockey — NHL. Tennis — ATP / WTA tours, 4 Grand Slams (Australian Open Jan, Roland Garros / French Open May-Jun, Wimbledon late Jun-Jul, US Open Aug-Sep). Golf — PGA Tour, LPGA, LIV, 4 majors (Masters, PGA Championship, US Open, The Open). F1 — Formula 1 (Mar-Dec, ~24 races, drivers' & constructors' championships). Olympics — Summer + Winter, alternating every 2 yrs. Paralympics follow. Cricket / kabaddi / hockey big in South Asia. Rugby (Six Nations, World Cup) — UK, Ireland, France, ANZ, RSA. Australian Rules Football (AFL) — Australia."
