    category: health
  - text: "Common neurological / age-related: dementia, Alzheimer's, Parkinson's, multiple sclerosis (MS), epilepsy, migraine (with / without aura), cluster headache, sleep apnea (OSA), narcolepsy, restless legs, fibromyalgia."
    category: health
  - text: "Major allergens: peanut, tree nuts (almond, walnut, cashew, pistachio, hazelnut, brazil, macadamia, pecan), shellfish (shrimp, prawn, crab, lobster), fish, dairy / lactose, gluten / wheat (celiac is autoimmune), soy, egg, sesame, sulphites, mustard, lupin. Non-food: pollen, dust mites, animal dander, mould, latex, insect stings (bees / wasps), penicillin / sulpha drugs."
    category: health
  - text: "Body metric ranges (adult): BMI <18.5 underweight, 18.5-24.9 normal, 25-29.9 overweight, 30+ obese (WHO; for South Asians some guidelines lower thresholds). BP <120/80 normal, 120-129/<80 elevated, 130-139/80-89 stage 1 hypertension, ≥140/90 stage 2. Resting HR 60-100 normal."
    category: health
  - text: "Blood sugar (fasting plasma glucose, mg/dL): <100 normal, 100-125 prediabetic, ≥126 diabetic. HbA1c: <5.7% normal, 5.7-6.4% prediabetic, ≥6.5% diabetic. (mmol/L: divide mg/dL by 18.)"
    category: health
  - text: "Cholesterol targets (mg/dL): total <200 desirable; LDL <100 optimal (<70 if high CV risk); HDL ≥60 protective; triglycerides <150 normal."
    category: health
  - text: "Common medications (generic): metformin (T2 diabetes), atorvastatin / rosuvastatin (cholesterol), lisinopril / amlodipine / losartan / telmisartan (BP), omeprazole / pantoprazole / esomeprazole (acid reflux), levothyroxine (hypothyroid), sertraline / escitalopram / fluoxetine / venlafaxine (depression / anxiety SSRIs/SNRIs), bupropion (depression / quit smoking), methylphenidate / amphetamine salts (ADHD), salbutamol / albuterol (asthma rescue), montelukast, insulin (T1 / advanced T2), warfarin / apixaban / rivaroxaban (anticoagulants), aspirin (low-dose CV protection), ibuprofen, paracetamol / acetaminophen (Tylenol)."
    category: health
  - text: "Common supplements: vitamin D (esp. low-sun regions), B12 (esp. vegetarians), iron (anaemia), calcium (bone), magnesium (cramps / sleep), omega-3 / fish oil (heart), multivitamin, protein powder (whey, casein, plant), creatine (performance), zinc, melatonin (sleep)."
    category: health
  - text: "Healthcare specialist roles: GP / family doctor, paediatrician, gynaecologist / OB-GYN, cardiologist, neurologist, oncologist, psychiatrist (MD), psychologist (PhD/PsyD, talk therapy), therapist / counsellor, dietitian / nutritionist, physiotherapist, chiropractor, dentist, orthodontist (braces), optometrist (vision tests) vs ophthalmologist (eye MD), dermatologist, ENT (ear-nose-throat), urologist, gastroenterologist, endocrinologist (hormones), rheumatologist, pulmonologist, nephrologist (kidney), haematologist."
    category: health
  - text: "Common surgeries: appendectomy, cesarean (C-section), gallbladder (cholecystectomy), hernia, tonsillectomy, LASIK / SMILE (vision correction), cataract, knee / hip replacement, ACL repair, bariatric (weight loss), hysterectomy, prostatectomy, coronary bypass / CABG, angioplasty / stent."
    category: health
  - text: "Wellness practices: yoga (asana physical, pranayama breathing, dhyana meditation), pilates, HIIT, cardio (running, cycling, swimming), strength / weight training, mobility, recovery, sleep hygiene, mindfulness / meditation, intermittent fasting, cold plunge / ice bath, sauna."
    category: health
  - text: "Reproductive / family-planning: contraception (oral pill, IUD copper / hormonal, implant, condom, vasectomy, tubal), fertility (IVF, IUI, ICSI, egg / sperm freezing), pregnancy trimesters (1st 0-13 wk, 2nd 14-27, 3rd 28-40), TTC (trying to conceive), miscarriage, postpartum, breastfeeding, menopause."
    category: health

  # ═══════════════════════════════════════════════════════════════════════════
  # finance — instruments, exchanges, taxes, banking, crypto
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Asset classes: equities / stocks (ownership), fixed income / bonds (debt), real estate, commodities (gold, silver, oil, agri), crypto, cash / money market, alternatives (PE, hedge funds, art, collectibles)."
    category: finance
  - text: "Indian investment instruments: stocks (NSE/BSE listed), mutual funds (equity / debt / hybrid), SIP (recurring), lump sum, FD (fixed deposit), RD, PPF (15-yr lock-in, tax-free), NPS, EPF, VPF, ELSS (tax-saver mutual fund 80C), NSC, KVP, SCSS (senior citizen), Sukanya Samriddhi (girl child), sovereign gold bond / gold ETF, REITs, InvITs. Tax-saving: 80C limit ₹1.5 lakh/year."
    category: finance
  - text: "US retirement / investment: 401(k) employer-sponsored ($23K/yr 2024 limit), Traditional IRA, Roth IRA ($7K limit), SEP IRA / Solo 401(k) (self-employed), HSA (high-deductible health plan), FSA (use-it-or-lose), 529 plan (education), ESPP / RSU / ISO / NSO (equity), brokerage (taxable), Treasuries (T-bill <1yr / T-note 2-10 / T-bond 20-30), municipal bonds (tax-free), CDs, money market funds."
    category: finance
  - text: "UK investment: ISA (£20K/yr tax-free — Cash, Stocks & Shares, Innovative Finance, Lifetime LISA up to £4K with 25% gov bonus), JISA (junior), SIPP (self-invested pension), workplace pension (auto-enrol), Premium Bonds (NS&I prize draw)."
    category: finance
  - text: "Other regions retirement: Australia — Superannuation ('super', employer 11.5% mandatory), SMSF (self-managed). Singapore — CPF (Central Provident Fund — Ordinary, Special, Medisave, Retirement accounts). Canada — RRSP (registered retirement), TFSA (tax-free savings). Hong Kong — MPF."
    category: finance
  - text: "Major stock exchanges: NYSE, NASDAQ (US); LSE (UK); NSE, BSE (India); TSE / JPX (Tokyo); HKEX (Hong Kong); SSE (Shanghai), SZSE (Shenzhen); KOSPI / KOSDAQ (Korea); TWSE (Taiwan); SGX (Singapore); ASX (Australia); TSX (Canada); B3 (Brazil); JSE (South Africa); DFM / ADX (UAE); Tadawul (Saudi)."
    category: finance
  - text: "Major equity indices: S&P 500, NASDAQ Composite, NASDAQ-100, Dow Jones (DJIA, 30 stocks), Russell 2000 (small cap), Russell 3000 (US); Nifty 50, Sensex 30, Nifty Bank, Nifty IT, Nifty Next 50 (India); FTSE 100, FTSE 250 (UK); Nikkei 225, TOPIX (Japan); Hang Seng (HK); CSI 300 (China); KOSPI (Korea); ASX 200 (Australia); DAX 40 (Germany); CAC 40 (France); MSCI World, MSCI EM (global)."
    category: finance
  - text: "Stock ticker hints: 1-5 uppercase letters typically. US: AAPL, MSFT, GOOG / GOOGL, AMZN, META, NVDA, TSLA, BRK.A / BRK.B, JPM. Indian on NSE: RELIANCE, TCS, HDFCBANK, INFY, ITC, LT, SBIN, HDFC, BHARTIARTL, MARUTI. Indices use prefixes: ^GSPC, ^NSEI."
    category: finance
  - text: "Tax authorities: IRS (US — federal), state DORs; HMRC (UK); Income Tax Department + CBDT (India), GST Council; ATO (Australia); CRA (Canada); IRAS (Singapore); BIR (Philippines); SARS (S. Africa); FBR (Pakistan); LHDN (Malaysia)."
    category: finance
  - text: "Tax concepts: capital gains (short-term <1yr higher rate, long-term lower; India equity LTCG 12.5% above ₹1.25L exemption), dividend tax, income tax slabs (progressive), deductions (US — itemised vs standard; India — 80C / 80D / 80E), withholding (TDS in India, withholding in US, PAYE in UK), advance tax, ITR (India) / Form 16, W-2 / 1099, Self Assessment (UK)."
    category: finance
  - text: "Banking concepts: savings vs current (India) / checking (US/UK), debit vs credit card, credit utilization (<30% recommended), credit score ranges — FICO 300-850 (US, 670+ good), CIBIL 300-900 (India, 750+ good), Experian / Equifax UK 0-999, secured vs unsecured loans, revolving (credit card) vs installment (mortgage / auto)."
    category: finance
  - text: "Payment systems: India — UPI (BHIM, GPay, PhonePe, Paytm), IMPS, NEFT, RTGS, AePS. US — ACH, wire, Zelle, Venmo, Cash App, Apple Pay, Google Pay. UK — Faster Payments, BACS, CHAPS, Open Banking. EU — SEPA. Asia — Alipay / WeChat Pay (China), PayNow (Singapore), PromptPay (Thailand), DuitNow (Malaysia), GCash (PH), MoMo (Vietnam), Pix (Brazil)."
    category: finance
  - text: "Loans: home loan / mortgage (15/20/30-year, fixed vs floating / ARM), auto loan, personal loan, education loan, credit card revolving, BNPL (buy-now-pay-later — Afterpay, Klarna, Affirm, Simpl, ZestMoney). Concepts: EMI, amortisation, principal, interest, refinance, prepayment penalty, foreclosure."
    category: finance
  - text: "Insurance: term life (pure cover), whole life / endowment, ULIP (India — life + investment), health (individual, family floater, group, top-up, super top-up), critical illness rider, accident, disability, auto (comprehensive vs third-party only), home / contents, travel, pet, professional indemnity."
    category: finance
  - text: "Crypto basics: Bitcoin (BTC, store of value), Ethereum (ETH, smart contracts), Solana (SOL), BNB, XRP, Cardano (ADA), Polkadot (DOT), stablecoins USDT / USDC / DAI (peg to $1). DeFi (decentralised finance), NFTs, staking, yield farming, gas fees. Wallets: hot (MetaMask, Phantom, Trust) vs cold / hardware (Ledger, Trezor). Exchanges: Coinbase, Binance, Kraken, Gemini (US/global); WazirX, CoinDCX, CoinSwitch (India)."
    category: finance
  - text: "Real estate basics: ready-to-move-in vs under-construction; freehold vs leasehold; BHK (India: 1BHK = 1 bedroom + hall + kitchen, 2BHK / 3BHK common); carpet area < built-up < super built-up; price per sq ft; RERA (Indian regulator); HOA (US homeowners' assoc.); stamp duty; registration; mortgage / home loan; LVR / LTV (loan-to-value); EMI; pre-EMI; reverse mortgage."
    category: finance

  # ═══════════════════════════════════════════════════════════════════════════
  # tech — languages, frameworks, infra, AI/ML, hardware
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Major programming languages: Python (data, ML, scripting, web), JavaScript / TypeScript (web frontend & Node backend), Java (enterprise, Android), Go (infra, services), Rust (systems, perf), C / C++ (systems, embedded, games), C# (.NET, Unity), Swift (iOS / macOS), Kotlin (Android, server), Ruby (Rails web), PHP (legacy web), Scala / Clojure (JVM functional), R / MATLAB (stats, numerical), Lua (game scripting), Dart (Flutter), Zig, Elixir, Haskell, Julia."
    category: tech
  - text: "Web frontend: React, Next.js (React+SSR), Vue + Nuxt, Angular, Svelte + SvelteKit, Solid, Remix, Astro, Qwik. Mobile: native iOS (Swift / SwiftUI), native Android (Kotlin / Jetpack Compose), cross-platform — React Native, Flutter, Xamarin / .NET MAUI, Expo."
    category: tech
  - text: "Web backend frameworks: Django, FastAPI, Flask (Python); Express, NestJS, Hono, Fastify (Node); Spring / Spring Boot (Java); Rails (Ruby); Laravel / Symfony (PHP); Gin, Fiber, Echo (Go); Actix, Axum, Rocket (Rust); ASP.NET (C#); Phoenix (Elixir)."
    category: tech
  - text: "Databases — relational: PostgreSQL, MySQL / MariaDB, SQLite, Microsoft SQL Server, Oracle. Document / NoSQL: MongoDB, DynamoDB, Firebase / Firestore, CouchDB. Key-value / cache: Redis, Memcached, Valkey. Search: Elasticsearch, OpenSearch, Solr, Meilisearch, Typesense. Analytics / OLAP: ClickHouse, Snowflake, BigQuery, Redshift, Databricks, DuckDB. Graph: Neo4j, Dgraph, Memgraph. Vector: Pinecone, Weaviate, Qdrant, Milvus, Chroma, pgvector. Time-series: InfluxDB, TimescaleDB, Prometheus. Wide-column: Cassandra, ScyllaDB, HBase. Streaming: Kafka, Pulsar, Redpanda, Kinesis."
    category: tech
  - text: "DevOps / infra: containers — Docker, Podman, containerd. Orchestration — Kubernetes (k8s), Nomad, ECS. IaC — Terraform, OpenTofu, Pulumi, CloudFormation. Config — Ansible, Chef, Puppet, Salt. Packaging — Helm. GitOps — ArgoCD, Flux. CI/CD — Jenkins, GitLab CI, GitHub Actions, CircleCI, Buildkite, TeamCity. Observability — Prometheus, Grafana, Datadog, New Relic, Honeycomb, OpenTelemetry."
    category: tech
  - text: "Cloud providers: AWS (EC2, S3, RDS, Lambda, EKS, DynamoDB, CloudFront, Route 53, IAM), Azure (VMs, Blob, SQL DB, Functions, AKS, AAD), GCP (GCE, GCS, Cloud SQL, Cloud Functions, GKE, BigQuery, Vertex AI, Firebase). Edge / dev-friendly — Cloudflare (Workers, R2, D1, Durable Objects), Vercel, Netlify, Fly.io, Render, Railway, Deno Deploy. Indie / cheap — DigitalOcean, Linode (Akamai), Hetzner, OVH, Vultr."
    category: tech
  - text: "AI / ML terminology: LLM (large language model), token, context window, embedding, vector search, RAG (retrieval-augmented generation), fine-tuning, RLHF, DPO, chain-of-thought, agent, tool / function calling, MCP (Model Context Protocol), prompt engineering, few-shot / zero-shot, hallucination, multimodal (text+image+audio+video), inference, training, transformer, attention, mixture-of-experts (MoE)."
    category: tech
  - text: "LLM providers / models: OpenAI (GPT-4o, GPT-4.1, o1, o3); Anthropic (Claude — Opus, Sonnet, Haiku); Google (Gemini Pro / Flash / Ultra); Meta (Llama 3 / 4, open weights); Mistral (Mistral, Mixtral); Cohere (Command R+); xAI (Grok); Alibaba (Qwen — open weights); DeepSeek (V3, R1); Yi (01.AI); Microsoft Phi. Local runtimes: Ollama, llama.cpp, vLLM, LM Studio, Jan."
    category: tech
  - text: "ML / AI frameworks: PyTorch, TensorFlow, JAX (low-level); scikit-learn (classical ML); Hugging Face Transformers (model hub + library); LangChain, LlamaIndex (orchestration); LiteLLM (provider abstraction); vLLM, TGI (serving); Ray (distributed); Weights & Biases / MLflow / Comet (tracking); ONNX (interop)."
    category: tech
  - text: "Hardware: CPU architectures — x86 / x86-64 / amd64 (Intel, AMD), ARM / aarch64 (mobile, Apple Silicon M1/M2/M3/M4, AWS Graviton, modern servers), RISC-V (open). GPUs — NVIDIA (consumer RTX 4090 / 5090, datacenter A100 / H100 / H200 / B200), AMD Radeon / Instinct MI300, Apple unified memory, Intel Arc. Other accelerators — Google TPU, AWS Trainium / Inferentia, Cerebras, Graphcore. Memory — DDR4 / DDR5, HBM (high-bandwidth on GPUs). Storage — NVMe SSD > SATA SSD > HDD."
    category: tech
  - text: "Operating systems: macOS (latest Sequoia / 15), iOS / iPadOS, Linux distros (Ubuntu / Debian, Fedora / RHEL / CentOS / Rocky / Alma, Arch / Manjaro, openSUSE, Pop!_OS, NixOS, Alpine), Windows 10 / 11, Android (AOSP + skins — Samsung One UI, Xiaomi MIUI / HyperOS, OnePlus OxygenOS, Pixel stock), ChromeOS, BSDs (FreeBSD, OpenBSD)."
    category: tech
  - text: "Browsers: Chrome (Blink), Safari (WebKit), Firefox (Gecko), Edge (Blink), Brave (Blink, privacy), Arc (Blink, opinionated), Opera, Vivaldi, Tor Browser. Mobile: Safari (iOS default), Chrome (Android default)."
    category: tech
  - text: "Code editors / IDEs: VS Code (widely used), Cursor (AI-first fork), Zed (fast, Rust), Neovim / Vim, Emacs, Sublime Text. JetBrains family — IntelliJ IDEA (Java/Kotlin), PyCharm (Python), WebStorm (JS/TS), GoLand (Go), CLion (C++), RustRover, RubyMine, PhpStorm, DataGrip. Mobile / native — Xcode (Apple), Android Studio (Google). AI-powered — Cursor, Windsurf, Continue, Cody."
    category: tech

  # ═══════════════════════════════════════════════════════════════════════════
  # food / cuisine — global cuisines, dishes, brands
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "World cuisines (broad): Indian, Chinese, Japanese, Korean, Thai, Vietnamese, Filipino, Indonesian, Malaysian, Italian, French, Spanish, Greek, Turkish, Lebanese / Levantine, Mexican, Peruvian, Brazilian, American (BBQ, Tex-Mex, Cajun, soul, diner), Ethiopian, Moroccan, Persian / Iranian, German, British, Nordic, Caribbean."
    category: food
  - text: "Indian regional cuisines: North — Punjabi (butter chicken, tandoori, naan), Mughlai (biryani, kebabs), Rajasthani (dal baati, gatte), Awadhi (Lucknowi). South — Tamil (sambar, dosa, idli, chettinad), Kerala (appam, fish curry, sadya), Andhra (spicy, biryani), Karnataka (bisi bele bath, mangalorean fish). East — Bengali (fish, sweets — rasgulla, mishti doi), Odia, Assamese. West — Maharashtrian (vada pav, misal, modak), Gujarati (thali, dhokla, undhiyu), Goan (vindaloo, xacuti, fish curry)."
    category: food
  - text: "Common globally-recognised dishes: pizza (Italian — Margherita, Neapolitan, NY-style, deep-dish), pasta (carbonara, bolognese, alfredo, aglio e olio), sushi (nigiri, maki, sashimi, temaki), ramen (shoyu, miso, tonkotsu, shio), pho, pad thai, biryani (Hyderabadi, Lucknowi, Kolkata), butter chicken, dosa, idli, samosa, dumplings (gyoza, momo, wonton, xiaolongbao), tacos, burritos, burger, hot dog, kebabs, falafel, hummus, shawarma, paella."
    category: food
  - text: "Coffee menu: espresso (single shot ~30ml), americano (espresso + hot water), latte (espresso + steamed milk + microfoam), cappuccino (espresso + equal milk + foam), flat white (double ristretto + microfoam), cortado (espresso + small steamed milk), macchiato (espresso + dollop of foam), mocha (espresso + chocolate + milk), cold brew (steeped 12-24h cold), pour-over (V60, Chemex, Kalita), drip, French press, AeroPress, moka pot."
    category: food
  - text: "Tea varieties: black (Assam, Darjeeling, Earl Grey, English Breakfast, Ceylon), green (sencha, gyokuro, dragon well, matcha — powdered), oolong (semi-oxidised, Tieguanyin, Da Hong Pao), white (silver needle, white peony), pu'er (fermented), masala chai (Indian — black tea + milk + cardamom / ginger / cinnamon), herbal / tisanes (chamomile, peppermint, rooibos), bubble tea (Taiwanese — milk tea + tapioca pearls / boba)."
    category: food
  - text: "Alcoholic beverages: beer styles (lager, pilsner, IPA, pale ale, stout / porter, wheat / hefeweizen, sour, cider); wine (red — cabernet, merlot, pinot noir, syrah / shiraz, malbec; white — chardonnay, sauvignon blanc, riesling, pinot grigio; sparkling — champagne, prosecco, cava; rosé; dessert / fortified — port, sherry); spirits (whiskey — scotch, bourbon, rye, single malt, blended; rum, vodka, gin, tequila, mezcal); Asian — sake (Japan), soju (Korea), baijiu (China), shochu, feni (Goa)."
    category: food
  - text: "Global F&B chains: Starbucks, McDonald's, KFC, Subway, Domino's, Pizza Hut, Burger King, Taco Bell, Chipotle, Dunkin', Costa, Pret a Manger, Five Guys, Shake Shack, Tim Hortons (Canada), Greggs (UK). Premium / specialty — Blue Bottle, Stumptown, Intelligentsia."
    category: food
  - text: "Indian F&B brands / chains: Amul (dairy), Britannia, Parle, Haldiram's, Bikanervala, Saravana Bhavan, MTR, Naturals (ice cream), Hatti Kaapi, Chai Point, Blue Tokai, Third Wave Coffee, Bira / Kingfisher / Sula (alcohol). Restaurants — Mainland China, Barbeque Nation, Social, Smoke House Deli."
    category: food
  - text: "Asian F&B chains: bubble tea — Gong Cha, CoCo, Kung Fu Tea, Chatime, Tiger Sugar, HEYTEA. Japan — Mos Burger, Yoshinoya, Sukiya, Coco Ichibanya. China / pan-Asia — Haidilao (hotpot), Din Tai Fung (xiaolongbao), Tim Ho Wan (dim sum), Jollibee (Filipino fried chicken), Tully's, Doutor."
    category: food

  # ═══════════════════════════════════════════════════════════════════════════
  # transportation — cars, airlines, ride-share, transit
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Major car brands by origin: Japan — Toyota (incl. Lexus), Honda (Acura), Nissan (Infiniti), Mazda, Subaru, Suzuki, Mitsubishi. Korea — Hyundai (Genesis), Kia. Germany — BMW (Mini), Mercedes-Benz, Audi, Porsche, VW. France — Renault, Peugeot, Citroën. Italy — Fiat, Alfa Romeo, Ferrari, Lamborghini, Maserati. UK — Land Rover, Jaguar, Bentley, Rolls-Royce, McLaren, Aston Martin. Sweden — Volvo, Polestar. US — Ford (Lincoln), GM (Chevrolet, Cadillac, Buick, GMC), Tesla, Rivian, Lucid, Chrysler / Dodge / Jeep / Ram. India — Maruti Suzuki, Tata Motors, Mahindra. China — BYD, Geely, Nio, XPeng, Li Auto, MG (UK-origin, now SAIC)."
    category: transport
  - text: "Two-wheeler brands: Honda, Yamaha, Kawasaki, Suzuki, BMW Motorrad, KTM, Ducati, Triumph, Harley-Davidson, Royal Enfield (Indian heritage), Bajaj (Pulsar, Avenger), TVS (Apache, Jupiter), Hero MotoCorp (Splendor), Ola Electric, Ather (Indian EV)."
    category: transport
  - text: "Major full-service airlines: Middle East — Emirates (DXB), Qatar Airways (DOH), Etihad (AUH), Saudia. Asia — Singapore Airlines (SIN), Cathay Pacific (HKG), ANA / JAL (Tokyo), Korean Air / Asiana (ICN), China Eastern / China Southern / Air China, Thai Airways. Europe — Lufthansa (FRA / MUC), Air France (CDG), KLM (AMS), British Airways (LHR), Swiss, Iberia, Turkish Airlines (IST hub, biggest network). Americas — Delta, United, American (US big 3), Air Canada. Oceania — Qantas (SYD), Air New Zealand. India — Air India (now Tata-owned, full-service), Vistara (merged into AI 2024)."
    category: transport
  - text: "Major low-cost carriers: India — IndiGo (largest), SpiceJet, Akasa Air (newest, 2022). Europe — Ryanair, easyJet, Wizz Air. US — Southwest, JetBlue (hybrid), Spirit, Frontier, Allegiant. Asia — AirAsia, Scoot (SIA group), Lion Air, Cebu Pacific (PH), VietJet, IndiGo. Middle East — flydubai, Air Arabia."
    category: transport
  - text: "Ride-share / taxi apps by region: Global — Uber. US / Canada — Lyft. India — Ola Cabs, Uber, Rapido (bike taxis), BluSmart (EV). EU — Bolt, Free Now, Heetch (FR). Latin America — Cabify, 99 (Brazil), DiDi (also China). China — DiDi (dominant). SE Asia — Grab (Singapore HQ, regional), Gojek (Indonesia, merged with Tokopedia → GoTo). Middle East — Careem (acquired by Uber, regional). Africa — Bolt, Uber, inDrive."
    category: transport
  - text: "Major public transit systems: NYC Subway, London Underground / 'the Tube' (oldest, 1863), Paris Métro, Tokyo Metro + JR (most efficient), Singapore MRT, Hong Kong MTR, Seoul Metro, Beijing / Shanghai Metro (largest by length), Moscow Metro (deep, ornate), Berlin U-Bahn / S-Bahn. India — Delhi Metro (largest in India), Mumbai Metro + suburban 'locals' (Western/Central/Harbour lines, lifeline), Bangalore Metro (Namma), Kolkata (oldest Indian metro), Chennai, Hyderabad. High-speed rail — Shinkansen (Japan), TGV (France), KTX (Korea), CR400 / Fuxing (China), Eurostar (Channel)."
    category: transport
  - text: "Aviation lingo: PNR (passenger name record / booking ref), ETA / ETD, layover (short connection) vs stopover (long / overnight), red-eye (overnight), jet lag, codeshare, miles / points / award travel. Loyalty programs / alliances — Star Alliance (Singapore, Lufthansa, ANA, United, Air India), oneworld (BA, Qatar, Cathay, AA, Qantas), SkyTeam (Delta, Air France, KLM, Korean). Big programs — Mileage Plus (UA), AAdvantage (AA), SkyMiles (DL), KrisFlyer (SQ), Asia Miles (CX), Skywards (EK), Flying Blue (AF/KL)."
    category: transport

  # ═══════════════════════════════════════════════════════════════════════════
  # media / entertainment — streaming, social, gaming, sports leagues
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Streaming platforms (video): Netflix (global), Disney+ (incl. Hotstar in India), Amazon Prime Video, HBO Max / Max, Apple TV+, Hulu (US), Peacock (NBC US), Paramount+, YouTube Premium. India-focused — JioCinema, Zee5, SonyLIV, MX Player, Voot, ALTBalaji. China — iQIYI, Youku, Tencent Video, Bilibili. Korea — Wavve, TVING, Coupang Play. Japan — Hulu Japan, Netflix Japan, AbemaTV."
    category: media
  - text: "Streaming platforms (music): Spotify (largest global), Apple Music, YouTube Music, Amazon Music, Tidal (hi-fi), Deezer (FR-origin global), Pandora (US legacy). India — JioSaavn, Gaana, Wynk Music. China — QQ Music, NetEase Cloud Music, Kugou. Korea — Melon, Genie, FLO."
    category: media
  - text: "Major social platforms: Instagram (Meta), TikTok (ByteDance, banned in India 2020), Facebook (Meta), X / Twitter, LinkedIn (Microsoft), YouTube (Google), Snapchat, Pinterest, Reddit, Threads (Meta), Bluesky, Mastodon (federated), Tumblr. Messaging — WhatsApp (Meta, dominant in India / EU / LATAM), Telegram, Signal, iMessage, Discord, Slack, Microsoft Teams, Zoom. China-only — WeChat / Weixin, Weibo, Xiaohongshu / RedNote / 'Little Red Book', Douyin (CN TikTok), Bilibili, Kuaishou, QQ. Korea — KakaoTalk, Naver Band, LINE (Japan / Taiwan / Thailand)."
    category: media
  - text: "Gaming platforms: PC — Steam (Valve), Epic Games Store, GOG, Battle.net (Blizzard), Origin / EA App, Ubisoft Connect, itch.io. Console — PlayStation 5 (Sony), Xbox Series X/S (Microsoft), Nintendo Switch / Switch 2. Cloud — GeForce Now, Xbox Cloud Gaming, PlayStation Plus Premium. Mobile — Apple Arcade, Google Play Pass. Subscription — Xbox Game Pass, PS Plus, EA Play, Ubisoft+. Popular esports / mainstream titles — League of Legends, Valorant, Counter-Strike 2, Dota 2, Fortnite, Apex Legends, PUBG / BGMI (India), Free Fire, Genshin Impact, Honkai Star Rail, Minecraft, GTA V."
    category: media
  - text: "Cricket: formats — Test (5 days), ODI (50 overs), T20 (20 overs), T10. Major leagues — IPL (Indian Premier League, Mar-May, ~10 franchises), Big Bash (AU), PSL (Pakistan), CPL (Caribbean), The Hundred (UK 100-ball), SA20 (South Africa), Major League Cricket (MLC, USA). International — ICC events: T20 World Cup, ODI World Cup (every 4 yrs), Champions Trophy, World Test Championship. Boards: BCCI (India), ECB (England), CA (Australia), PCB (Pakistan)."
    category: media
  - text: "Football / soccer top leagues: Premier League (England, ~Aug-May, 20 clubs — Man City, Liverpool, Arsenal, Man Utd, Chelsea, Tottenham), La Liga (Spain — Real Madrid, Barcelona, Atlético), Bundesliga (Germany — Bayern dominant), Serie A (Italy — Inter, Juve, Milan, Napoli), Ligue 1 (France — PSG dominant), MLS (US/CA, Mar-Oct). India — ISL (Indian Super League), I-League. Continental — UEFA Champions League, Europa League, Copa Libertadores (S. America), AFC Champions League. International — FIFA World Cup (every 4 yrs), Euro, Copa América, AFCON, AFC Asian Cup."
