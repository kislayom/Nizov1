    category: terminology
  - text: "HR / equity: PIP = performance improvement plan; RSU = restricted stock unit; ESOP = employee stock ownership plan; ESPP = employee stock purchase plan; vesting cliff = first chunk of equity unlocking; sabbatical; garden leave; severance."
    category: terminology
  - text: "Indian work / finance: EMI = equated monthly installment (loan); SIP = systematic investment plan (mutual fund); FD = fixed deposit; RD = recurring deposit; PPF = public provident fund; NPS = national pension scheme; EPF = employees' provident fund; CTC = cost to company (gross salary inc. benefits)."
    category: terminology
  - text: "US benefits / payroll: 401(k); IRA = individual retirement account; HSA = health savings; FSA = flexible spending; W-2 = employment income form; 1099 = contractor income; ACA = Affordable Care Act; COBRA = continued health coverage after job loss."
    category: terminology
  - text: "UK benefits: ISA = individual savings account (£20k/yr tax-free); LISA = lifetime ISA; SIPP = self-invested personal pension; NI = National Insurance; PAYE = pay as you earn; HMRC = tax authority; VAT = value-added tax (~20%)."
    category: terminology
  - text: "Universal business: KPI = key performance indicator; OKR = objectives & key results; SLA = service level agreement; ROI = return on investment; P&L = profit and loss; EBITDA = earnings before interest/taxes/depreciation/amortisation; ARR/MRR = annual/monthly recurring revenue; CAC = customer acquisition cost; LTV = lifetime value."
    category: terminology
  - text: "Company stage: pre-seed, seed, Series A/B/C/D, growth, late stage, pre-IPO, IPO, public, post-IPO, unicorn (>$1B valuation), decacorn (>$10B), down round."
    category: terminology
  - text: "Indian admin: KYC = know your customer; AML = anti-money laundering; GST = goods & services tax; TDS = tax deducted at source; ITR = income tax return; PAN = permanent account number; UPI = unified payments interface."
    category: terminology

  # ═══════════════════════════════════════════════════════════════════════════
  # currency — symbols, codes, regional notation
  # ═══════════════════════════════════════════════════════════════════════════
  - text: "Currency symbols → codes: ₹ INR (India); $ USD (default; also CAD/AUD/SGD/HKD/NZD with prefix); € EUR (Eurozone); £ GBP (UK); ¥ JPY (Japan) or CNY/RMB (China); ₩ KRW (Korea); ฿ THB (Thailand); ₽ RUB (Russia); ₺ TRY (Turkey); ₪ ILS (Israel); R$ BRL (Brazil); R ZAR (South Africa); CHF (Switzerland); AED/د.إ (UAE); SAR (Saudi Arabia)."
    category: currency
  - text: "Indian large-number notation: 1 lakh = 100,000 (10⁵); 1 crore = 10,000,000 (10⁷); 1 arab = 100 crore (10⁹). '50 lakhs' = ₹50,00,000 = ₹5 million. '2 crore' = ₹2,00,00,000 = ₹20 million."
    category: currency
  - text: "Western large-number notation: K = thousand (10³); M / mn = million (10⁶); B / bn = billion (10⁹); T / tn = trillion (10¹²). '$50K salary' = $50,000; '$10M raise' = $10 million."
    category: currency
  - text: "When user writes a bare $ without context, default to USD. When writing ₹, default to INR. For ¥, prefer JPY unless China context (CNY/RMB)."
    category: currency
  - text: "Crypto units: BTC (Bitcoin, 8 decimals, 1 satoshi = 10⁻⁸ BTC); ETH (Ethereum, 18 decimals, 1 wei = 10⁻¹⁸ ETH); stablecoins USDT/USDC pegged 1:1 to USD; SOL (Solana); BNB (Binance); XRP (Ripple)."
    category: currency
  - text: "Forex majors: EUR/USD, USD/JPY, GBP/USD, USD/CHF, AUD/USD, USD/CAD, NZD/USD. Asian: USD/INR, USD/CNY, USD/SGD, USD/HKD."
    category: currency

