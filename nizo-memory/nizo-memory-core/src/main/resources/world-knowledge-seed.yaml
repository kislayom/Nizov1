  - text: "Major auto manufacturers' parent groups: Stellantis (FCA + PSA merger 2021 — Fiat, Chrysler, Jeep, Ram, Dodge, Peugeot, Citroën, Opel, Alfa Romeo, Maserati); Volkswagen Group (VW, Audi, Porsche, Lamborghini, Bentley, Bugatti, Škoda, SEAT); BMW Group (BMW, Mini, Rolls-Royce); Mercedes-Benz Group; Toyota (Toyota, Lexus, Daihatsu, Hino); Honda (Honda, Acura); Nissan-Renault-Mitsubishi alliance; Hyundai Motor Group (Hyundai, Kia, Genesis); Geely (incl. Volvo Cars, Polestar, Lotus, Smart); BYD (own EVs); Tata Motors (incl. Jaguar Land Rover); Mahindra; Maruti Suzuki (Suzuki Japan parent)."
    category: companies
  - text: "Major energy companies: Saudi Aramco (largest by revenue), ExxonMobil, Chevron, ConocoPhillips, Marathon, Occidental (US); Shell, BP (UK / Netherlands); TotalEnergies (France); Eni (Italy); Equinor (Norway); CNPC / PetroChina, Sinopec, CNOOC (China); Reliance (India downstream); Indian Oil Corporation (IOCL), Bharat Petroleum (BPCL), Hindustan Petroleum (HPCL), ONGC, GAIL (India PSUs); ADNOC (UAE); QatarEnergy; Petrobras (Brazil); Rosneft, Gazprom, Lukoil (Russia). Renewables — Ørsted (DK offshore wind), NextEra (US), Iberdrola (ES), Adani Green, Tata Power Renewable, ReNew (India)."
    category: companies
  - text: "Major retail chains: US — Walmart (largest globally by revenue), Costco, Target, Home Depot, Lowe's, Kroger, CVS, Walgreens, Best Buy, Macy's, Nordstrom, TJX (TJ Maxx, Marshalls, HomeGoods), Dollar General, Dollar Tree. UK — Tesco, Sainsbury's, ASDA, Morrisons, Marks & Spencer, John Lewis, Waitrose, Aldi UK, Lidl UK, Boots. Germany — Aldi, Lidl (Schwarz Group, largest EU retailer), Edeka, Rewe, dm. France — Carrefour, Auchan, E.Leclerc, Casino. Sweden — IKEA (furniture, global), H&M. Spain — Inditex (Zara, Bershka, Pull&Bear, Massimo Dutti, Stradivarius), Mercadona. India — Reliance Retail (largest), DMart / Avenue Supermarts, Spencer's, More Retail, Star Bazaar, Big Bazaar (closed). Japan — 7-Eleven (Seven & i), AEON, Lawson, FamilyMart, Don Quijote, Uniqlo (Fast Retailing). China — Alibaba's offline (Hema / Freshippo), JD MRO, Suning."
